<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hapki Snap — Admin</title>
<link rel="stylesheet" href="style.css">
<style>
  .login-wrap{
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card{
    width: 100%;
    max-width: 380px;
    padding: 40px 32px;
    background: var(--ink-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }
  .login-card h1{
    font-family: var(--font-display);
    font-weight: 400;
    letter-spacing: 0.01em;
    font-size: 32px;
    margin: 0 0 8px;
  }
  .login-card p{ color: var(--graphite); font-size: 14px; margin: 0 0 24px; }
  .login-card .field{ margin-bottom: 12px; }
  .login-error{ font-size: 13px; color: var(--flash); min-height: 16px; margin: 8px 0 0; }

  #dashboard{ display: none; }
  .admin-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px clamp(16px, 3vw, 40px);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
    gap: 12px;
  }
  .admin-header h1{
    font-family: var(--font-display);
    font-weight: 400;
    letter-spacing: 0.01em;
    font-size: 28px;
    margin: 0;
  }
  .admin-tools{ display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .download-status{
    font-size: 12px;
    color: var(--graphite);
    min-width: 0;
  }
  .btn-ghost:disabled{ opacity: 0.5; cursor: default; }
  .admin-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 18px;
    padding: 24px clamp(16px, 3vw, 40px) 60px;
  }
  .admin-tile{
    background: var(--ink-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .admin-tile img{ width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
  .admin-tile.hidden-photo{ opacity: 0.45; }
  .admin-tile .meta{ padding: 10px 12px; font-size: 13px; }
  .admin-tile .meta .name{ font-weight: 600; margin-bottom: 2px; }
  .admin-tile .meta .filter-tag{ color: var(--graphite); font-size: 12px; }
  .admin-tile .actions{ display: flex; gap: 8px; padding: 0 12px 12px; }
  .admin-tile .actions button{
    flex: 1;
    padding: 8px;
    font-size: 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--paper);
  }
  .admin-tile .actions .danger:hover{ border-color: var(--flash); color: var(--flash); }
  .admin-empty{ padding: 80px 40px; text-align: center; color: var(--graphite); }
</style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <div class="login-card viewfinder">
    <span class="vf-tl"></span><span class="vf-tr"></span>
    <span class="vf-bl"></span><span class="vf-br"></span>
    <h1>Admin</h1>
    <p>Sign in to manage photos on Hapki Snap.</p>
    <input class="field" id="emailField" type="email" placeholder="Email" autocomplete="username">
    <input class="field" id="passField" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn btn-primary" id="loginBtn" style="width:100%; margin-top:8px;">Sign in</button>
    <p class="login-error" id="loginError"></p>
  </div>
</div>

<div id="dashboard">
  <div class="admin-header">
    <h1>Manage Photos</h1>
    <div class="admin-tools">
      <span class="frame-counter" id="adminCount">0 photos</span>
      <span class="download-status" id="downloadStatus"></span>
      <button class="btn btn-ghost" id="downloadAllBtn">Download all</button>
      <button class="btn btn-ghost" id="logoutBtn">Sign out</button>
    </div>
  </div>
  <div class="admin-grid" id="adminGrid"></div>
  <div class="admin-empty" id="adminEmpty" style="display:none;">No photos yet.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
  const loginWrap = document.getElementById('loginWrap');
  const dashboard = document.getElementById('dashboard');
  const emailField = document.getElementById('emailField');
  const passField = document.getElementById('passField');
  const loginBtn = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');
  const logoutBtn = document.getElementById('logoutBtn');
  const adminGrid = document.getElementById('adminGrid');
  const adminEmpty = document.getElementById('adminEmpty');
  const adminCount = document.getElementById('adminCount');
  const downloadAllBtn = document.getElementById('downloadAllBtn');
  const downloadStatus = document.getElementById('downloadStatus');

  async function checkSession(){
    const { data } = await supabaseClient.auth.getSession();
    if (data.session) showDashboard();
  }

  loginBtn.addEventListener('click', async () => {
    loginError.textContent = '';
    loginBtn.disabled = true;
    const { error } = await supabaseClient.auth.signInWithPassword({
      email: emailField.value.trim(),
      password: passField.value
    });
    loginBtn.disabled = false;
    if (error){
      loginError.textContent = 'Incorrect email or password.';
      return;
    }
    showDashboard();
  });

  passField.addEventListener('keydown', (e) => { if (e.key === 'Enter') loginBtn.click(); });

  logoutBtn.addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    dashboard.style.display = 'none';
    loginWrap.style.display = 'flex';
  });

  function showDashboard(){
    loginWrap.style.display = 'none';
    dashboard.style.display = 'block';
    loadPhotos();
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function loadPhotos(){
    try{
      const photos = await fetchAllPhotosAdmin();
      adminGrid.innerHTML = '';
      adminCount.textContent = `${photos.length} photo${photos.length === 1 ? '' : 's'}`;
      adminEmpty.style.display = photos.length === 0 ? 'block' : 'none';

      photos.forEach(photo => {
        const tile = document.createElement('div');
        tile.className = 'admin-tile' + (photo.visible ? '' : ' hidden-photo');
        tile.innerHTML = `
          <img src="${photo.photo_url}" alt="photo from ${escapeHtml(photo.username)}">
          <div class="meta">
            <div class="name">${escapeHtml(photo.username)}</div>
            <div class="filter-tag">filter: ${escapeHtml(photo.filter_name)}</div>
          </div>
          <div class="actions">
            <button class="toggle-btn" data-id="${photo.id}" data-visible="${photo.visible}">
              ${photo.visible ? 'Hide' : 'Show'}
            </button>
            <button class="danger delete-btn" data-id="${photo.id}" data-path="${photo.storage_path}">Delete</button>
          </div>
        `;
        adminGrid.appendChild(tile);
      });
    }catch(err){
      console.error(err);
      adminEmpty.textContent = 'Failed to load photos.';
      adminEmpty.style.display = 'block';
    }
  }

  adminGrid.addEventListener('click', async (e) => {
    const toggleBtn = e.target.closest('.toggle-btn');
    const deleteBtn = e.target.closest('.delete-btn');

    if (toggleBtn){
      const id = toggleBtn.dataset.id;
      const currentlyVisible = toggleBtn.dataset.visible === 'true';
      toggleBtn.disabled = true;
      try{
        await setPhotoVisibility(id, !currentlyVisible);
        loadPhotos();
      }catch(err){
        console.error(err);
        toggleBtn.disabled = false;
      }
    }

    if (deleteBtn){
      if (!confirm('Delete this photo permanently?')) return;
      const id = deleteBtn.dataset.id;
      const path = deleteBtn.dataset.path;
      deleteBtn.disabled = true;
      try{
        await deletePhoto(id, path);
        loadPhotos();
      }catch(err){
        console.error(err);
        deleteBtn.disabled = false;
      }
    }
  });

  function sanitizeFilename(name){
    const cleaned = name.replace(/[^a-zA-Z0-9-_]+/g, '_').replace(/^_+|_+$/g, '');
    return cleaned || 'photo';
  }

  // Fetches items with a limited number of requests in flight at
  // once (rather than one-at-a-time, which is slow for a big event,
  // or all-at-once, which can overwhelm the browser/network).
  async function mapWithConcurrency(items, limit, worker){
    const results = new Array(items.length);
    let nextIndex = 0;
    async function runNext(){
      while (nextIndex < items.length){
        const i = nextIndex++;
        results[i] = await worker(items[i], i);
      }
    }
    const runners = Array.from({ length: Math.min(limit, items.length) }, runNext);
    await Promise.all(runners);
    return results;
  }

  downloadAllBtn.addEventListener('click', async () => {
    downloadAllBtn.disabled = true;
    downloadStatus.textContent = 'Loading photo list...';
    try{
      const photos = await fetchAllPhotosAdmin();
      if (photos.length === 0){
        downloadStatus.textContent = 'No photos to download.';
        setTimeout(() => { downloadStatus.textContent = ''; }, 2500);
        return;
      }

      const zip = new JSZip();
      const usedNames = new Set();
      let done = 0;
      let failed = 0;
      downloadStatus.textContent = `Downloading 0/${photos.length}...`;

      await mapWithConcurrency(photos, 6, async (photo) => {
        try{
          const res = await fetch(photo.photo_url);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const blob = await res.blob();

          let base = sanitizeFilename(photo.username) + '-' + photo.id.slice(0, 8);
          let name = base + '.jpg';
          let n = 1;
          while (usedNames.has(name)){ name = `${base}-${n++}.jpg`; }
          usedNames.add(name);

          zip.file(name, blob);
        }catch(err){
          console.error('Failed to fetch photo for zip:', photo.id, err);
          failed++;
        }finally{
          done++;
          downloadStatus.textContent = `Downloading ${done}/${photos.length}...`;
        }
      });

      downloadStatus.textContent = 'Zipping...';
      const content = await zip.generateAsync({ type: 'blob' });

      const dateStamp = new Date().toISOString().slice(0, 10);
      const url = URL.createObjectURL(content);
      const a = document.createElement('a');
      a.href = url;
      a.download = `hapkisnap-photos-${dateStamp}.zip`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);

      downloadStatus.textContent = failed > 0
        ? `Done — ${failed} photo${failed === 1 ? '' : 's'} couldn't be fetched.`
        : 'Download ready!';
      setTimeout(() => { downloadStatus.textContent = ''; }, 4000);
    }catch(err){
      console.error(err);
      downloadStatus.textContent = 'Failed to prepare download.';
    }finally{
      downloadAllBtn.disabled = false;
    }
  });

  checkSession();
</script>

</body>
</html>
