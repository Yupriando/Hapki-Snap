<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hapki Snap — Camera</title>
<link rel="stylesheet" href="style.css">
<style>
  body{ overflow: hidden; }
  .stage{
    position: relative;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  .topbar{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    z-index: 5;
    flex: 0 0 auto;
  }
  .name-tag{
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: rgba(19,18,20,0.7);
    border: 1px solid var(--line);
    font-size: 13px;
    color: var(--paper);
    backdrop-filter: blur(6px);
  }
  .name-tag .dot{ width: 6px; height: 6px; border-radius: 50%; background: var(--flash); }
  .exit-link{
    font-size: 13px;
    color: var(--graphite);
    padding: 8px 14px;
    background: rgba(19,18,20,0.7);
    border: 1px solid var(--line);
    backdrop-filter: blur(6px);
  }

  .cam-wrap{
    flex: 1;
    min-height: 0;
    position: relative;
    margin: 0 20px;
    overflow: hidden;
    background: #000;
  }
  video{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }
  .color-wash{
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: transparent;
    mix-blend-mode: normal;
  }
  .flash-overlay{
    position: absolute;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
  }
  .flash-overlay.firing{ animation: flashfire 0.35s ease-out; }
  @keyframes flashfire{
    0%{ opacity: 0.9; }
    100%{ opacity: 0; }
  }
  .cam-status{
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--graphite);
    font-size: 14px;
    text-align: center;
    padding: 24px;
    z-index: 4;
  }

  .filter-panel{ flex: 0 0 auto; padding: 12px 20px 4px; }
  .filter-row-label{ font-size: 12px; color: var(--graphite-dim); margin: 4px 0 6px 2px; }
  .filter-strip{
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 8px;
    -webkit-overflow-scrolling: touch;
  }
  .filter-strip::-webkit-scrollbar{ display: none; }
  .filter-chip{
    flex: 0 0 auto;
    padding: 9px 16px;
    font-size: 13px;
    color: var(--graphite);
    background: var(--ink-raised);
    border: 1px solid var(--line);
    white-space: nowrap;
  }
  .filter-chip.active{
    color: var(--paper);
    background: var(--flash);
    border-color: var(--flash);
    font-weight: 600;
  }

  .shutter-row{
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px 20px max(20px, env(safe-area-inset-bottom));
    flex: 0 0 auto;
  }
  .shutter-btn{
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: transparent;
    border: 3px solid var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .shutter-btn .inner{
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--flash);
    transition: transform 0.1s ease, background 0.1s ease;
  }
  .shutter-btn:active .inner{ transform: scale(0.85); }
  .shutter-btn:disabled .inner{ background: var(--graphite-dim); }

  .review-overlay{
    position: fixed;
    inset: 0;
    background: var(--ink);
    z-index: 20;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .review-overlay.show{ display: flex; }
  .review-frame{
    position: relative;
    max-width: 460px;
    width: 100%;
    background: var(--paper);
    padding: 12px 12px 44px;
  }
  .review-frame img{ width: 100%; display: block; }
  .review-caption{
    position: absolute;
    bottom: 12px;
    left: 12px;
    font-family: var(--font-display);
    font-size: 20px;
    color: var(--ink);
  }
  .review-actions{
    display: flex;
    gap: 12px;
    margin-top: 24px;
    width: 100%;
    max-width: 460px;
  }
  .review-actions .btn{ flex: 1; }
  .upload-status{ margin-top: 14px; font-size: 13px; color: var(--graphite); min-height: 18px; }
</style>
</head>
<body>

<canvas id="captureCanvas" style="display:none;"></canvas>

<div class="stage">
  <div class="topbar">
    <div class="name-tag"><span class="dot"></span><span id="userTag">Anonymous</span></div>
    <a class="exit-link" href="index.html">Change name</a>
  </div>

  <div class="cam-wrap viewfinder" id="camWrap">
    <span class="vf-tl"></span><span class="vf-tr"></span>
    <span class="vf-bl"></span><span class="vf-br"></span>
    <video id="video" autoplay playsinline muted></video>
    <div class="color-wash" id="colorWash"></div>
    <div class="flash-overlay" id="flashOverlay"></div>
    <div class="cam-status" id="camStatus">Requesting camera access...</div>
  </div>

  <div class="filter-panel">
    <p class="filter-row-label">Filters</p>
    <div class="filter-strip" id="filterStrip"></div>
  </div>

  <div class="shutter-row">
    <button class="shutter-btn" id="shutterBtn" disabled><span class="inner"></span></button>
  </div>
</div>

<div class="review-overlay" id="reviewOverlay">
  <div class="review-frame">
    <img id="reviewImg" alt="captured photo">
    <div class="review-caption" id="reviewCaption"></div>
  </div>
  <div class="review-actions">
    <button class="btn" id="retakeBtn">Retake</button>
    <button class="btn btn-primary" id="sendBtn">Post to wall</button>
  </div>
  <p class="upload-status" id="uploadStatus"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  const username = sessionStorage.getItem('hapkisnap_username') || 'Anonymous';
  document.getElementById('userTag').textContent = username;
  document.getElementById('reviewCaption').textContent = username;

  // Each filter combines a standard CSS/canvas color-adjustment
  // filter with an optional color-wash + blend mode, which is what
  // gives the more Snapchat-like duotone/glow looks (a flat filter()
  // alone can't do that; a blended color layer can).
  const FILTERS = [
    { label: 'Original',      css: 'none' },
    { label: 'B&W',           css: 'grayscale(1) contrast(1.1)' },
    { label: 'Noir',          css: 'grayscale(1) contrast(1.4) brightness(0.9)' },
    { label: 'Warm',          css: 'sepia(0.35) saturate(1.4) contrast(1.05)' },
    { label: 'Cool',          css: 'saturate(1.2) hue-rotate(-8deg) contrast(1.05) brightness(1.05)' },
    { label: 'Vivid',         css: 'saturate(1.6) contrast(1.15)' },
    { label: 'Fade',          css: 'contrast(0.85) brightness(1.1) saturate(0.7)' },
    { label: 'Vintage',       css: 'sepia(0.4) contrast(1.1) brightness(0.95) saturate(0.8)' },
    { label: 'Golden Hour',   css: 'sepia(0.25) saturate(1.5) brightness(1.08) hue-rotate(-6deg)' },
    { label: 'Cyberpunk',     css: 'saturate(1.8) hue-rotate(200deg) contrast(1.2)' },
    { label: 'Pastel',        css: 'saturate(0.6) brightness(1.15) contrast(0.9)' },
    { label: 'Infrared',      css: 'hue-rotate(280deg) saturate(2) contrast(1.1)' },
    { label: 'Mono Blue',     css: 'grayscale(0.6) hue-rotate(180deg) saturate(1.4)' },
    { label: 'Sunset Glow',   css: 'saturate(1.2) contrast(1.05)', wash: 'rgba(255,120,40,0.35)', blend: 'overlay' },
    { label: 'Neon Nights',   css: 'contrast(1.15) saturate(1.3) brightness(0.95)', wash: 'rgba(180,40,220,0.30)', blend: 'screen' },
    { label: 'Arctic Frost',  css: 'saturate(1.1) brightness(1.05)', wash: 'rgba(80,180,255,0.30)', blend: 'soft-light' },
    { label: 'Duotone Red',   css: 'grayscale(1) contrast(1.1)', wash: 'rgba(217,30,54,0.55)', blend: 'color' },
    { label: 'Duotone Blue',  css: 'grayscale(1) contrast(1.1)', wash: 'rgba(37,87,199,0.55)', blend: 'color' },
    { label: 'Dreamy Glow',   css: 'brightness(1.1) contrast(0.85) saturate(1.2)', wash: 'rgba(255,255,255,0.25)', blend: 'screen' },
    { label: 'Retro Film',    css: 'sepia(0.15) contrast(1.1) saturate(0.9)', wash: 'rgba(255,210,80,0.2)', blend: 'multiply' }
  ];

  const video = document.getElementById('video');
  const colorWash = document.getElementById('colorWash');
  const camStatus = document.getElementById('camStatus');
  const shutterBtn = document.getElementById('shutterBtn');
  const flashOverlay = document.getElementById('flashOverlay');
  const canvas = document.getElementById('captureCanvas');
  const filterStrip = document.getElementById('filterStrip');

  const reviewOverlay = document.getElementById('reviewOverlay');
  const reviewImg = document.getElementById('reviewImg');
  const retakeBtn = document.getElementById('retakeBtn');
  const sendBtn = document.getElementById('sendBtn');
  const uploadStatus = document.getElementById('uploadStatus');

  let currentFilter = FILTERS[0];
  let capturedBlob = null;

  // build filter chips
  FILTERS.forEach((f, i) => {
    const chip = document.createElement('button');
    chip.className = 'filter-chip' + (i === 0 ? ' active' : '');
    chip.textContent = f.label;
    chip.dataset.index = i;
    filterStrip.appendChild(chip);
  });

  function applyFilterToPreview(f){
    video.style.filter = f.css;
    colorWash.style.background = f.wash || 'transparent';
    colorWash.style.mixBlendMode = f.blend || 'normal';
  }

  filterStrip.addEventListener('click', (e) => {
    const chip = e.target.closest('.filter-chip');
    if (!chip) return;
    filterStrip.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    currentFilter = FILTERS[Number(chip.dataset.index)];
    applyFilterToPreview(currentFilter);
  });

  async function startCamera(){
    try{
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } },
        audio: false
      });
      video.srcObject = stream;
      camStatus.style.display = 'none';
      shutterBtn.disabled = false;
    }catch(err){
      camStatus.textContent = "Can't access the camera. Please allow camera access in your browser, then refresh this page.";
      console.error(err);
    }
  }
  startCamera();

  shutterBtn.addEventListener('click', () => {
    flashOverlay.classList.remove('firing');
    void flashOverlay.offsetWidth;
    flashOverlay.classList.add('firing');

    const w = video.videoWidth;
    const h = video.videoHeight;
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');

    ctx.save();
    ctx.filter = currentFilter.css;
    ctx.translate(w, 0);
    ctx.scale(-1, 1); // mirror to match preview
    ctx.drawImage(video, 0, 0, w, h);
    ctx.filter = 'none';

    if (currentFilter.wash){
      ctx.globalCompositeOperation = currentFilter.blend || 'source-over';
      ctx.fillStyle = currentFilter.wash;
      ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.restore();

    canvas.toBlob((blob) => {
      capturedBlob = blob;
      reviewImg.src = URL.createObjectURL(blob);
      reviewOverlay.classList.add('show');
      uploadStatus.textContent = '';
    }, 'image/jpeg', 0.92);
  });

  retakeBtn.addEventListener('click', () => {
    reviewOverlay.classList.remove('show');
    capturedBlob = null;
  });

  sendBtn.addEventListener('click', async () => {
    if (!capturedBlob) return;
    sendBtn.disabled = true;
    retakeBtn.disabled = true;
    uploadStatus.textContent = 'Sending to the wall...';
    try{
      await uploadPhoto(capturedBlob, username, currentFilter.label);
      uploadStatus.textContent = 'Sent! Your photo is now on the big screen.';
      setTimeout(() => {
        reviewOverlay.classList.remove('show');
        capturedBlob = null;
        sendBtn.disabled = false;
        retakeBtn.disabled = false;
      }, 1400);
    }catch(err){
      console.error(err);
      uploadStatus.textContent = 'Failed to send. Check your connection and try again.';
      sendBtn.disabled = false;
      retakeBtn.disabled = false;
    }
  });
</script>

</body>
</html>
