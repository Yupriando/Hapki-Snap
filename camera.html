<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hapki Snap — Camera</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        overflow: hidden;
      }
      .stage {
        position: relative;
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px;
        z-index: 5;
        flex: 0 0 auto;
      }
      .name-tag {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        background: rgba(19, 18, 20, 0.7);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        font-size: 13px;
        color: var(--paper);
        backdrop-filter: blur(6px);
      }
      .name-tag .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--flash);
      }

      .logo-chip {
        display: flex;
        align-items: center;
        padding: 6px 14px;
        background: rgba(19, 18, 20, 0.7);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        backdrop-filter: blur(6px);
      }
      .logo-chip img {
        height: 26px;
        width: auto;
        display: block;
      }

      .cam-wrap {
        flex: 1;
        min-height: 0;
        position: relative;
        margin: 0 20px;
        overflow: hidden;
        border-radius: var(--radius);
        background: #000;
        touch-action: none; /* so pinch-to-zoom doesn't also zoom the page */
      }
      video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .color-wash {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: transparent;
        mix-blend-mode: normal;
      }
      .flash-overlay {
        position: absolute;
        inset: 0;
        background: #fff;
        opacity: 0;
        pointer-events: none;
      }
      .flash-overlay.firing {
        animation: flashfire 0.35s ease-out;
      }
      @keyframes flashfire {
        0% {
          opacity: 0.9;
        }
        100% {
          opacity: 0;
        }
      }
      /* Full-screen bright flash used as a substitute "flash" for the
     front camera (which has no physical flash) — briefly lights up
     the whole display so it reflects onto the subject's face. */
      .screen-flash {
        position: fixed;
        inset: 0;
        background: #fff;
        opacity: 0;
        pointer-events: none;
        z-index: 50;
        transition: opacity 0.12s ease;
      }
      .grain-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
        background-size: 180px 180px;
        z-index: 2;
        transition: opacity 0.15s ease;
      }
      .grain-overlay.active {
        opacity: 0.3;
      }
      .cam-wrap.vignette::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        box-shadow: inset 0 0 90px 26px rgba(0, 0, 0, 0.55);
        z-index: 2;
      }
      .cam-status {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--graphite);
        font-size: 14px;
        text-align: center;
        padding: 24px;
        z-index: 4;
      }

      .zoom-controls {
        position: absolute;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 10px;
        z-index: 4;
      }
      .zoom-btn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: rgba(19, 18, 20, 0.7);
        border: 1px solid var(--line);
        color: var(--paper);
        font-size: 19px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(6px);
        font-family: var(--font-ui);
      }
      .zoom-btn:active {
        transform: scale(0.92);
      }
      .zoom-label {
        font-size: 11px;
        color: var(--paper);
        background: rgba(19, 18, 20, 0.7);
        border-radius: var(--radius-sm);
        padding: 2px 6px;
        min-width: 34px;
        text-align: center;
      }

      .filter-panel {
        flex: 0 0 auto;
        padding: 12px 20px 4px;
      }
      .filter-row-label {
        font-size: 12px;
        color: var(--graphite-dim);
        margin: 4px 0 6px 2px;
      }
      .filter-strip {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        padding-bottom: 8px;
        -webkit-overflow-scrolling: touch;
      }
      .filter-strip::-webkit-scrollbar {
        display: none;
      }
      .filter-chip {
        flex: 0 0 auto;
        padding: 9px 16px;
        font-size: 13px;
        color: var(--graphite);
        background: var(--ink-raised);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        white-space: nowrap;
      }
      .filter-chip.active {
        color: var(--paper);
        background: var(--flash);
        border-color: var(--flash);
        font-weight: 600;
      }

      .shutter-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 30px;
        padding: 10px 20px max(20px, env(safe-area-inset-bottom));
        flex: 0 0 auto;
      }
      .shutter-btn {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: transparent;
        border: 3px solid var(--paper);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      .shutter-btn .inner {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: var(--flash);
        transition:
          transform 0.1s ease,
          background 0.1s ease;
      }
      .shutter-btn:active .inner {
        transform: scale(0.85);
      }
      .shutter-btn:disabled .inner {
        background: var(--graphite-dim);
      }

      .side-btn {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: var(--ink-raised);
        border: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--paper);
      }
      .side-btn svg {
        width: 21px;
        height: 21px;
      }
      .side-btn:active {
        transform: scale(0.92);
      }
      .side-btn.active {
        background: var(--flash);
        border-color: var(--flash);
      }
      /* Shown when flash is on for the back camera but the real hardware
         torch couldn't be verified as engaged — the app falls back to
         brightening the photo digitally instead. */
      .side-btn.active.torch-unsupported {
        background: var(--ink-raised);
        border-color: var(--flash);
        color: var(--flash);
      }
      .torch-debug {
        display: none;
        font-size: 11px;
        line-height: 1.5;
        color: var(--graphite-dim);
        background: var(--ink-raised);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        padding: 8px 10px;
        margin: 0 20px 8px;
        white-space: pre-wrap;
        font-family: monospace;
      }
      .torch-debug.show {
        display: block;
      }

      .review-overlay {
        position: fixed;
        inset: 0;
        background: var(--ink);
        z-index: 20;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .review-overlay.show {
        display: flex;
      }
      .review-frame {
        position: relative;
        max-width: 460px;
        width: 100%;
        background: var(--paper);
        padding: 12px 12px 44px;
        border-radius: var(--radius);
        overflow: hidden;
      }
      .review-frame img {
        width: 100%;
        display: block;
      }
      .review-caption {
        position: absolute;
        bottom: 12px;
        left: 12px;
        font-family: var(--font-display);
        font-size: 20px;
        color: var(--ink);
      }
      .review-actions {
        display: flex;
        gap: 12px;
        margin-top: 24px;
        width: 100%;
        max-width: 460px;
      }
      .review-actions .btn {
        flex: 1;
      }
      .upload-status {
        margin-top: 14px;
        font-size: 13px;
        color: var(--graphite);
        min-height: 18px;
      }
    </style>
  </head>
  <body>
    <canvas id="captureCanvas" style="display: none"></canvas>
    <div class="screen-flash" id="screenFlash"></div>

    <div class="stage">
      <div class="topbar">
        <div class="name-tag">
          <span class="dot"></span><span id="userTag">Anonymous</span>
        </div>
        <a
          class="logo-chip"
          href="index.html"
          aria-label="Hapki Snap — change name"
        >
          <img src="Logo Hapkido.png" alt="Hapki Snap logo" />
        </a>
      </div>

      <div class="cam-wrap viewfinder" id="camWrap">
        <span class="vf-tl"></span><span class="vf-tr"></span>
        <span class="vf-bl"></span><span class="vf-br"></span>
        <video id="video" autoplay playsinline muted></video>
        <div class="color-wash" id="colorWash"></div>
        <div class="grain-overlay" id="grainOverlay"></div>
        <div class="zoom-controls">
          <button
            class="zoom-btn"
            id="zoomOutBtn"
            type="button"
            aria-label="Zoom out"
          >
            −
          </button>
          <span class="zoom-label" id="zoomLabel">1.0×</span>
          <button
            class="zoom-btn"
            id="zoomInBtn"
            type="button"
            aria-label="Zoom in"
          >
            +
          </button>
        </div>
        <div class="flash-overlay" id="flashOverlay"></div>
        <div class="cam-status" id="camStatus">Requesting camera access...</div>
      </div>

      <div class="filter-panel">
        <p class="filter-row-label">Filters</p>
        <div class="filter-strip" id="filterStrip"></div>
      </div>

      <div class="torch-debug" id="torchDebug"></div>

      <div class="shutter-row">
        <button
          class="side-btn"
          id="flashBtn"
          type="button"
          aria-label="Toggle flash"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z" />
          </svg>
        </button>
        <button class="shutter-btn" id="shutterBtn" disabled>
          <span class="inner"></span>
        </button>
        <button
          class="side-btn"
          id="flipBtn"
          type="button"
          aria-label="Flip camera"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M17 2.1l4 4-4 4" />
            <path d="M3 12.2v-2a4 4 0 0 1 4-4h12.8M7 21.9l-4-4 4-4" />
            <path d="M21 11.8v2a4 4 0 0 1-4 4H4.2" />
          </svg>
        </button>
      </div>
    </div>

    <div class="review-overlay" id="reviewOverlay">
      <div class="review-frame">
        <img id="reviewImg" alt="captured photo" />
        <div class="review-caption" id="reviewCaption"></div>
      </div>
      <div class="review-actions">
        <button class="btn" id="retakeBtn">Retake</button>
        <button class="btn btn-primary" id="sendBtn">Post to wall</button>
      </div>
      <p class="upload-status" id="uploadStatus"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script>
      const username =
        sessionStorage.getItem("hapkisnap_username") || "Anonymous";
      document.getElementById("userTag").textContent = username;
      document.getElementById("reviewCaption").textContent = username;

      const FILTERS = [
        { label: "Original", css: "none" },
        { label: "B&W", css: "grayscale(1) contrast(1.1)" },
        { label: "Noir", css: "grayscale(1) contrast(1.4) brightness(0.9)" },
        { label: "Warm", css: "sepia(0.35) saturate(1.4) contrast(1.05)" },
        {
          label: "Cool",
          css: "saturate(1.2) hue-rotate(-8deg) contrast(1.05) brightness(1.05)",
        },
        { label: "Vivid", css: "saturate(1.6) contrast(1.15)" },
        { label: "Fade", css: "contrast(0.85) brightness(1.1) saturate(0.7)" },
        {
          label: "Vintage",
          css: "sepia(0.4) contrast(1.1) brightness(0.95) saturate(0.8)",
        },
        {
          label: "Golden Hour",
          css: "sepia(0.25) saturate(1.5) brightness(1.08) hue-rotate(-6deg)",
        },
        {
          label: "Cyberpunk",
          css: "saturate(1.8) hue-rotate(200deg) contrast(1.2)",
        },
        {
          label: "Pastel",
          css: "saturate(0.6) brightness(1.15) contrast(0.9)",
        },
        {
          label: "Infrared",
          css: "hue-rotate(280deg) saturate(2) contrast(1.1)",
        },
        {
          label: "Mono Blue",
          css: "grayscale(0.6) hue-rotate(180deg) saturate(1.4)",
        },
        {
          label: "Sunset Glow",
          css: "saturate(1.2) contrast(1.05)",
          wash: "rgba(255,120,40,0.35)",
          blend: "overlay",
        },
        {
          label: "Neon Nights",
          css: "contrast(1.15) saturate(1.3) brightness(0.95)",
          wash: "rgba(180,40,220,0.30)",
          blend: "screen",
        },
        {
          label: "Arctic Frost",
          css: "saturate(1.1) brightness(1.05)",
          wash: "rgba(80,180,255,0.30)",
          blend: "soft-light",
        },
        {
          label: "Duotone Red",
          css: "grayscale(1) contrast(1.1)",
          wash: "rgba(217,30,54,0.55)",
          blend: "color",
        },
        {
          label: "Duotone Blue",
          css: "grayscale(1) contrast(1.1)",
          wash: "rgba(37,87,199,0.55)",
          blend: "color",
        },
        {
          label: "Dreamy Glow",
          css: "brightness(1.1) contrast(0.85) saturate(1.2)",
          wash: "rgba(255,255,255,0.25)",
          blend: "screen",
        },
        {
          label: "Retro Film",
          css: "sepia(0.15) contrast(1.1) saturate(0.9)",
          wash: "rgba(255,210,80,0.2)",
          blend: "multiply",
        },
        {
          label: "Disposable Camera",
          // Live-preview approximation only — the real Fuji-film color
          // science (warm/green cast, lifted milky blacks, soft highlight
          // rolloff, teal shadow tint) runs per-pixel via applyFilmGrade().
          css: "contrast(1.05) saturate(0.85) sepia(0.14) hue-rotate(-8deg) brightness(1.02)",
          preset: "fujiDisposable",
          filmOpts: {
            exposure: 1.0,
            blackLift: 0.05,
            highlightMode: "soft",
            highlightAmt: 0.12,
            warmR: 10,
            warmG: 4,
            warmB: -12,
            contrast: 1.08,
            sat: 0.82,
            hiTint: 0.05,
            shTint: 0.12,
            shadowColor: [70, 150, 150],
          },
          vignette: true,
          vignetteInner: 0.5,
          vignetteOuter: 1.0,
          vignetteAlpha: 0.28,
          grain: true,
          grainAmount: 30,
        },
        {
          label: "Disposable Camera Flash",
          // Mimics a disposable camera's built-in flash firing: subject
          // blown bright and warm, background falls into cool near-black
          // very quickly, harder contrast, stronger corner falloff.
          css: "contrast(1.28) saturate(0.78) brightness(1.14) sepia(0.1)",
          preset: "fujiDisposableFlash",
          filmOpts: {
            exposure: 1.18,
            blackLift: 0.0,
            highlightMode: "blown",
            highlightAmt: 0.35,
            warmR: 16,
            warmG: 4,
            warmB: -18,
            contrast: 1.28,
            sat: 0.78,
            hiTint: 0.1,
            shTint: 0.3,
            shadowColor: [20, 40, 70],
          },
          hotspot: true,
          vignette: true,
          vignetteInner: 0.32,
          vignetteOuter: 0.85,
          vignetteAlpha: 0.5,
          grain: true,
          grainAmount: 24,
        },
      ];

      const video = document.getElementById("video");
      const colorWash = document.getElementById("colorWash");
      const grainOverlay = document.getElementById("grainOverlay");
      const camStatus = document.getElementById("camStatus");
      const shutterBtn = document.getElementById("shutterBtn");
      const flashOverlay = document.getElementById("flashOverlay");
      const screenFlash = document.getElementById("screenFlash");
      const canvas = document.getElementById("captureCanvas");
      const filterStrip = document.getElementById("filterStrip");
      const camWrap = document.getElementById("camWrap");

      const zoomInBtn = document.getElementById("zoomInBtn");
      const zoomOutBtn = document.getElementById("zoomOutBtn");
      const zoomLabel = document.getElementById("zoomLabel");
      const flashBtn = document.getElementById("flashBtn");
      const flipBtn = document.getElementById("flipBtn");

      const reviewOverlay = document.getElementById("reviewOverlay");
      const reviewImg = document.getElementById("reviewImg");
      const retakeBtn = document.getElementById("retakeBtn");
      const sendBtn = document.getElementById("sendBtn");
      const uploadStatus = document.getElementById("uploadStatus");

      let currentFilter = FILTERS[0];
      let capturedBlob = null;
      let currentFacingMode = "user";
      let currentStream = null;
      let flashOn = false;

      const ZOOM_MIN = 1,
        ZOOM_MAX = 100,
        ZOOM_STEP = 0.3;
      let zoomLevel = 1;

      // build filter chips
      FILTERS.forEach((f, i) => {
        const chip = document.createElement("button");
        chip.className = "filter-chip" + (i === 0 ? " active" : "");
        chip.textContent = f.label;
        chip.dataset.index = i;
        filterStrip.appendChild(chip);
      });

      function applyFilterToPreview(f) {
        video.style.filter = f.css;
        colorWash.style.background = f.wash || "transparent";
        colorWash.style.mixBlendMode = f.blend || "normal";
        grainOverlay.classList.toggle("active", !!f.grain);
        camWrap.classList.toggle("vignette", !!f.vignette);
      }

      filterStrip.addEventListener("click", (e) => {
        const chip = e.target.closest(".filter-chip");
        if (!chip) return;
        filterStrip
          .querySelectorAll(".filter-chip")
          .forEach((c) => c.classList.remove("active"));
        chip.classList.add("active");
        currentFilter = FILTERS[Number(chip.dataset.index)];
        applyFilterToPreview(currentFilter);
      });

      // ---------------- zoom (digital: crops the capture too, not just a visual scale) ----------------
      function updateVideoTransform() {
        const mirror = currentFacingMode === "user" ? -1 : 1;
        video.style.transform = `scaleX(${mirror}) scale(${zoomLevel})`;
        // The back camera's actual field of view looks like a ~0.5x wide
        // lens at zoomLevel 1, so only its displayed label is offset —
        // the front camera keeps showing the true 1.0x zoom level.
        const displayZoom =
          currentFacingMode === "environment" ? zoomLevel * 0.5 : zoomLevel;
        zoomLabel.textContent = displayZoom.toFixed(1) + "×";
      }

      function setZoom(level) {
        zoomLevel = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, level));
        updateVideoTransform();
      }

      zoomInBtn.addEventListener("click", () => setZoom(zoomLevel + ZOOM_STEP));
      zoomOutBtn.addEventListener("click", () =>
        setZoom(zoomLevel - ZOOM_STEP),
      );

      // Pinch-to-zoom for touch devices.
      let pinchStartDist = null;
      let pinchStartZoom = 1;
      function touchDist(touches) {
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.hypot(dx, dy);
      }
      camWrap.addEventListener(
        "touchstart",
        (e) => {
          if (e.touches.length === 2) {
            pinchStartDist = touchDist(e.touches);
            pinchStartZoom = zoomLevel;
          }
        },
        { passive: true },
      );
      camWrap.addEventListener(
        "touchmove",
        (e) => {
          if (e.touches.length === 2 && pinchStartDist) {
            const newDist = touchDist(e.touches);
            setZoom(pinchStartZoom * (newDist / pinchStartDist));
          }
        },
        { passive: true },
      );
      camWrap.addEventListener("touchend", () => {
        pinchStartDist = null;
      });

      const torchDebug = document.getElementById("torchDebug");

      // ---------------- flash (torch on back camera, screen-flash on front) ----------------
      // Tracks whether the torch is *actually* on right now — not just
      // whether the browser claims to support it. Some Android/Chrome +
      // camera-hardware combinations report `torch` as a supported
      // capability but silently fail to switch the LED when asked, so we
      // verify the real result via getSettings() rather than trusting
      // getCapabilities() alone.
      let torchEngaged = false;

      function showTorchDebug(lines) {
        // Cause confirmed (device never exposes torch capability at all),
        // so this no longer needs to be shown on-screen to end users —
        // kept as a console log only, in case it's needed again later.
        console.log("[torch debug]\n" + lines.join("\n"));
        torchDebug.classList.remove("show");
      }

      async function updateTorch() {
        if (!currentStream) {
          torchEngaged = false;
          return;
        }
        const track = currentStream.getVideoTracks()[0];
        if (!track || !track.getCapabilities) {
          torchEngaged = false;
          showTorchDebug(["getCapabilities() not supported on this browser at all."]);
          return;
        }
        const caps = track.getCapabilities();
        const wantTorch = flashOn && currentFacingMode === "environment";
        if (!caps.torch) {
          torchEngaged = false;
          showTorchDebug([
            "caps.torch: not present",
            "active lens: " + (activeCameraLabel || "(label hidden)"),
            "→ tried other rear lenses via enumerateDevices, none exposed torch.",
            "All caps: " + JSON.stringify(caps),
          ]);
          return;
        }

        let lastError = null;
        const tryApply = async () => {
          try {
            await track.applyConstraints({ advanced: [{ torch: wantTorch }] });
            // Give the camera hardware a beat, then check what actually
            // took effect instead of assuming applyConstraints worked.
            await new Promise((r) => setTimeout(r, 150));
            const settings = track.getSettings ? track.getSettings() : {};
            return { ok: wantTorch ? settings.torch === true : true, settings };
          } catch (err) {
            lastError = err;
            console.warn("Torch control not available:", err);
            return { ok: false, settings: null };
          }
        };

        let result = await tryApply();
        let retried = false;
        if (!result.ok && wantTorch) {
          // Some Android camera stacks need a brief moment after the
          // constraint call before the LED actually engages — retry once.
          retried = true;
          await new Promise((r) => setTimeout(r, 250));
          result = await tryApply();
        }
        torchEngaged = result.ok;
        flashBtn.classList.toggle(
          "torch-unsupported",
          wantTorch && !torchEngaged,
        );
        showTorchDebug([
          "caps.torch: present",
          "active lens: " + (activeCameraLabel || "(label hidden)"),
          "applyConstraints error: " + (lastError ? lastError.name + " — " + lastError.message : "none"),
          "retried: " + retried,
          "settings.torch after attempt: " + (result.settings ? result.settings.torch : "n/a"),
          "→ torch engaged: " + torchEngaged,
        ]);
      }

      flashBtn.addEventListener("click", () => {
        flashOn = !flashOn;
        flashBtn.classList.toggle("active", flashOn);
        updateTorch();
      });

      function triggerScreenFlash(duration) {
        return new Promise((resolve) => {
          screenFlash.style.opacity = "1";
          setTimeout(() => {
            screenFlash.style.opacity = "0";
            resolve();
          }, duration);
        });
      }

      function clamp255(v) {
        return v < 0 ? 0 : v > 255 ? 255 : v;
      }

      // Soft highlight rolloff (ambient "Disposable Camera") vs. an
      // aggressive blowout curve (the "Flash" version, mimicking direct
      // on-camera flash overexposing whatever it hits).
      function filmCurve(v, opts) {
        // Lifted blacks: a faded, milky film floor (skipped for the flash
        // shot, where the unlit background should stay genuinely dark).
        v = v + opts.blackLift * (1 - v);
        if (opts.highlightMode === "blown") {
          v += opts.highlightAmt * Math.pow(Math.max(0, v - 0.55) / 0.45, 3);
        } else {
          v -= opts.highlightAmt * Math.pow(Math.max(0, v - 0.7) / 0.3, 2);
        }
        return v < 0 ? 0 : v > 1 ? 1 : v;
      }

      // Shared Fuji-film-style grading used by both "Disposable Camera"
      // and "Disposable Camera Flash". `opts` (filter.filmOpts) is what
      // tells the two filters apart: exposure, tone curve, warm/green
      // color cast, contrast, saturation, and highlight/shadow tinting.
      function applyFilmGrade(ctx, w, h, opts) {
        const imgData = ctx.getImageData(0, 0, w, h);
        const d = imgData.data;
        const [scR, scG, scB] = opts.shadowColor;

        for (let i = 0; i < d.length; i += 4) {
          let r = d[i] * opts.exposure;
          let g = d[i + 1] * opts.exposure;
          let b = d[i + 2] * opts.exposure;

          r = filmCurve(r / 255, opts) * 255;
          g = filmCurve(g / 255, opts) * 255;
          b = filmCurve(b / 255, opts) * 255;

          // Warm yellow-green cast, characteristic of consumer Fuji film.
          r += opts.warmR;
          g += opts.warmG;
          b += opts.warmB;

          r = (r - 128) * opts.contrast + 128;
          g = (g - 128) * opts.contrast + 128;
          b = (b - 128) * opts.contrast + 128;

          const lum = 0.299 * r + 0.587 * g + 0.114 * b;
          r = lum + (r - lum) * opts.sat;
          g = lum + (g - lum) * opts.sat;
          b = lum + (b - lum) * opts.sat;

          // Split tone: warm highlights, cool/teal shadows — stronger on
          // the flash version so the flash-lit subject stays warm while
          // the unlit background sinks toward cool near-black.
          const l01 = lum / 255;
          const hiW = Math.pow(Math.max(0, l01 - 0.5) * 2, 2) * opts.hiTint;
          const shW = Math.pow(Math.max(0, 0.5 - l01) * 2, 2) * opts.shTint;
          r = r + (255 - r) * hiW * 0.4 + (scR - r) * shW;
          g = g + (240 - g) * hiW * 0.4 + (scG - g) * shW;
          b = b + (200 - b) * hiW * 0.4 + (scB - b) * shW;

          d[i] = clamp255(r);
          d[i + 1] = clamp255(g);
          d[i + 2] = clamp255(b);
        }
        ctx.putImageData(imgData, 0, 0);
      }

      // A digital stand-in for a real back-camera flash, used on devices
      // where the browser can't fire the actual hardware torch (see
      // updateTorch / shutter handler below). Beyond a plain brightness
      // boost, this adds a warm hotspot glow near the center — mimicking
      // how a real flash lights the subject brightest at the point it's
      // aimed — plus a touch of edge falloff, since a physical flash
      // rarely lights the whole frame evenly.
      function simulateExposureBoost(ctx, w, h) {
        const imgData = ctx.getImageData(0, 0, w, h);
        const d = imgData.data;
        for (let i = 0; i < d.length; i += 4) {
          for (let c = 0; c < 3; c++) {
            const v = d[i + c] * 1.32;
            d[i + c] = clamp255((v - 128) * 1.08 + 128);
          }
        }
        ctx.putImageData(imgData, 0, 0);

        const hotGrad = ctx.createRadialGradient(
          w / 2,
          h / 2,
          0,
          w / 2,
          h / 2,
          Math.min(w, h) * 0.65,
        );
        hotGrad.addColorStop(0, "rgba(255,244,222,0.32)");
        hotGrad.addColorStop(0.55, "rgba(255,244,222,0.12)");
        hotGrad.addColorStop(1, "rgba(255,244,222,0)");
        ctx.globalCompositeOperation = "screen";
        ctx.fillStyle = hotGrad;
        ctx.fillRect(0, 0, w, h);
        ctx.globalCompositeOperation = "source-over";

        const falloff = ctx.createRadialGradient(
          w / 2,
          h / 2,
          Math.min(w, h) * 0.45,
          w / 2,
          h / 2,
          Math.min(w, h) * 0.85,
        );
        falloff.addColorStop(0, "rgba(0,0,0,0)");
        falloff.addColorStop(1, "rgba(0,0,0,0.22)");
        ctx.fillStyle = falloff;
        ctx.fillRect(0, 0, w, h);
      }

      // Adds random noise to the captured photo (amount controls intensity,
      // e.g. 24 for "Disposable Camera"'s Grain: 26 preset value).
      function addGrain(ctx, w, h, amount = 28) {
        const imgData = ctx.getImageData(0, 0, w, h);
        const data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
          const noise = (Math.random() - 0.5) * amount;
          data[i] += noise;
          data[i + 1] += noise;
          data[i + 2] += noise;
        }
        ctx.putImageData(imgData, 0, 0);
      }

      // Tracks which physical lens (by label) ended up being used, purely
      // for the on-screen debug panel — helps diagnose which lens got
      // picked on a given Android device.
      let activeCameraLabel = "";

      // Some Android phones expose several rear lenses (main, ultra-wide,
      // macro, telephoto) as separate getUserMedia devices, and only the
      // main lens is wired to the physical LED flash. `facingMode:
      // "environment"` alone lets the browser/OS pick any of them, so if
      // the one it picked has no torch, we probe the other rear lenses
      // one at a time (stopping each before trying the next, since most
      // Android camera stacks refuse to have two lenses open at once) and
      // switch to the first one that actually reports `caps.torch`.
      async function findAndUseTorchCapableBackCamera(fallbackStream) {
        const fallbackTrack = fallbackStream.getVideoTracks()[0];
        const fallbackCaps = fallbackTrack.getCapabilities
          ? fallbackTrack.getCapabilities()
          : {};
        if (fallbackCaps.torch) return fallbackStream;

        let devices;
        try {
          devices = await navigator.mediaDevices.enumerateDevices();
        } catch (err) {
          return fallbackStream;
        }
        const videoInputs = devices.filter((d) => d.kind === "videoinput");
        if (videoInputs.length <= 1) return fallbackStream;

        const fallbackSettings = fallbackTrack.getSettings
          ? fallbackTrack.getSettings()
          : {};
        const fallbackDeviceId = fallbackSettings.deviceId;

        for (const dev of videoInputs) {
          if (dev.deviceId === fallbackDeviceId) continue;
          // Skip anything whose label plainly says it's a front lens —
          // saves a pointless open/close round trip on phones that list
          // the front camera in the same device list.
          if (/front|user|face/i.test(dev.label)) continue;

          let candidateStream;
          try {
            candidateStream = await navigator.mediaDevices.getUserMedia({
              video: {
                deviceId: { exact: dev.deviceId },
                width: { ideal: 1280 },
                height: { ideal: 960 },
              },
              audio: false,
            });
          } catch (err) {
            continue;
          }
          const track = candidateStream.getVideoTracks()[0];
          const caps = track.getCapabilities ? track.getCapabilities() : {};
          if (
            caps.torch &&
            !(caps.facingMode && caps.facingMode.includes("user"))
          ) {
            fallbackStream.getTracks().forEach((t) => t.stop());
            return candidateStream;
          }
          candidateStream.getTracks().forEach((t) => t.stop());
        }
        return fallbackStream;
      }

      // ---------------- camera ----------------
      async function startCamera(facingMode) {
        if (currentStream) {
          currentStream.getTracks().forEach((track) => track.stop());
          currentStream = null;
        }
        camStatus.style.display = "flex";
        camStatus.textContent = "Requesting camera access...";
        shutterBtn.disabled = true;
        try {
          let stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: { ideal: facingMode },
              width: { ideal: 1280 },
              height: { ideal: 960 },
            },
            audio: false,
          });
          if (facingMode === "environment") {
            stream = await findAndUseTorchCapableBackCamera(stream);
          }
          currentStream = stream;
          currentFacingMode = facingMode;
          const activeTrack = stream.getVideoTracks()[0];
          activeCameraLabel = activeTrack ? activeTrack.label : "";
          video.srcObject = stream;
          updateVideoTransform();
          camStatus.style.display = "none";
          shutterBtn.disabled = false;
          updateTorch();
        } catch (err) {
          console.error(err);
          if (facingMode === "environment") {
            camStatus.textContent =
              "Couldn't switch to the back camera on this device. Switching back to front camera...";
            setTimeout(() => startCamera("user"), 1400);
          } else {
            camStatus.textContent =
              "Can't access the camera. Please allow camera access in your browser, then refresh this page.";
          }
        }
      }
      startCamera(currentFacingMode);

      flipBtn.addEventListener("click", () => {
        const next = currentFacingMode === "user" ? "environment" : "user";
        setZoom(1); // start fresh on the newly selected camera
        startCamera(next);
      });

      shutterBtn.addEventListener("click", async () => {
        // Front camera has no physical flash, so a bright full-screen
        // flash stands in for it — the screen faces the subject in a
        // selfie, so this genuinely lights them up.
        if (flashOn && currentFacingMode === "user") {
          await triggerScreenFlash(220);
        }
        // For the back camera the screen faces the photographer, not the
        // subject, so a screen-flash there wouldn't actually light anything
        // up — it would just be a fake animation. If the real torch isn't
        // actually engaged right now — either because this browser/device
        // never exposes torch capability at all (varies by phone; Safari on
        // iOS 17.5+ does support it, but plenty of Android camera stacks
        // still don't) or because it silently failed to switch on — we
        // digitally brighten the captured photo below as the closest real
        // substitute. torchEngaged is verified in updateTorch(), not just
        // assumed from getCapabilities().
        const needsExposureBoost =
          flashOn && currentFacingMode === "environment" && !torchEngaged;

        flashOverlay.classList.remove("firing");
        void flashOverlay.offsetWidth;
        flashOverlay.classList.add("firing");

        const vw = video.videoWidth;
        const vh = video.videoHeight;
        const w = vw,
          h = vh;
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");

        // Zoom crops the source rectangle so the captured photo matches
        // what's actually visible in the (zoomed) preview.
        const sw = vw / zoomLevel;
        const sh = vh / zoomLevel;
        const sx = (vw - sw) / 2;
        const sy = (vh - sh) / 2;

        ctx.save();
        // Both Fuji-style filters are graded precisely per-pixel afterwards
        // (applyFilmGrade), so skip the CSS approximation here.
        const isFilmPreset =
          currentFilter.preset === "fujiDisposable" ||
          currentFilter.preset === "fujiDisposableFlash";
        if (!isFilmPreset) {
          ctx.filter = currentFilter.css;
        }
        if (currentFacingMode === "user") {
          ctx.translate(w, 0);
          ctx.scale(-1, 1); // mirror to match preview, front camera only
        }
        ctx.drawImage(video, sx, sy, sw, sh, 0, 0, w, h);
        ctx.filter = "none";

        if (currentFilter.wash) {
          ctx.globalCompositeOperation = currentFilter.blend || "source-over";
          ctx.fillStyle = currentFilter.wash;
          ctx.fillRect(0, 0, w, h);
          ctx.globalCompositeOperation = "source-over";
        }
        ctx.restore();

        if (isFilmPreset) {
          applyFilmGrade(ctx, w, h, currentFilter.filmOpts);
        }

        if (currentFilter.hotspot) {
          // Warm glow near the center, mimicking the beam of a built-in
          // flash — drawn before the vignette so the corners still darken.
          const hotGrad = ctx.createRadialGradient(
            w / 2,
            h / 2,
            0,
            w / 2,
            h / 2,
            Math.min(w, h) * 0.55,
          );
          hotGrad.addColorStop(0, "rgba(255,240,210,0.18)");
          hotGrad.addColorStop(1, "rgba(255,240,210,0)");
          ctx.globalCompositeOperation = "screen";
          ctx.fillStyle = hotGrad;
          ctx.fillRect(0, 0, w, h);
          ctx.globalCompositeOperation = "source-over";
        }

        if (currentFilter.vignette) {
          const inner = (currentFilter.vignetteInner ?? 0.35) * Math.min(w, h);
          const outer = (currentFilter.vignetteOuter ?? 0.72) * Math.min(w, h);
          const alpha = currentFilter.vignetteAlpha ?? 0.55;
          const grad = ctx.createRadialGradient(
            w / 2,
            h / 2,
            inner,
            w / 2,
            h / 2,
            outer,
          );
          grad.addColorStop(0, "rgba(0,0,0,0)");
          grad.addColorStop(1, `rgba(0,0,0,${alpha})`);
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, w, h);
        }

        if (currentFilter.grain) {
          addGrain(ctx, w, h, currentFilter.grainAmount);
        }

        if (needsExposureBoost) {
          simulateExposureBoost(ctx, w, h);
        }

        canvas.toBlob(
          (blob) => {
            capturedBlob = blob;
            reviewImg.src = URL.createObjectURL(blob);
            reviewOverlay.classList.add("show");
            uploadStatus.textContent = "";
          },
          "image/jpeg",
          0.92,
        );
      });

      retakeBtn.addEventListener("click", () => {
        reviewOverlay.classList.remove("show");
        capturedBlob = null;
      });

      sendBtn.addEventListener("click", async () => {
        if (!capturedBlob) return;
        sendBtn.disabled = true;
        retakeBtn.disabled = true;
        uploadStatus.textContent = "Sending to the wall...";
        try {
          await uploadPhoto(capturedBlob, username, currentFilter.label);
          uploadStatus.textContent =
            "Sent! Your photo is now on the big screen.";
          setTimeout(() => {
            reviewOverlay.classList.remove("show");
            capturedBlob = null;
            sendBtn.disabled = false;
            retakeBtn.disabled = false;
          }, 1400);
        } catch (err) {
          console.error(err);
          uploadStatus.textContent =
            "Failed to send. Check your connection and try again.";
          sendBtn.disabled = false;
          retakeBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
