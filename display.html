<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SnapWall — live wall</title>
<link rel="stylesheet" href="style.css">
<style>
  body{ overflow-x: hidden; }
  .wall-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 40px 8px;
  }
  .wall-title{
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 500;
    margin: 0;
  }
  .wall-title em{ font-style: italic; color: var(--flash); }
  .wall-meta{
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--graphite);
    font-size: 14px;
  }
  .live-dot{
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--flash);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%, 100%{ opacity: 1; }
    50%{ opacity: 0.3; }
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
    padding: 24px 40px 60px;
  }

  .tile{
    position: relative;
    background: var(--paper);
    padding: 10px 10px 38px;
    animation: land 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  @keyframes land{
    0%{ opacity: 0; transform: scale(0.85) translateY(14px); }
    100%{ opacity: 1; transform: scale(1) translateY(0); }
  }
  .tile img{
    width: 100%;
    aspect-ratio: 4/3;
    object-fit: cover;
    display: block;
    background: #000;
  }
  .tile .cap{
    position: absolute;
    bottom: 8px;
    left: 12px;
    right: 12px;
    font-family: var(--font-display);
    font-size: 15px;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .empty-state{
    padding: 100px 40px;
    text-align: center;
    color: var(--graphite);
  }
  .empty-state .big{
    font-family: var(--font-display);
    font-size: 32px;
    color: var(--paper);
    margin-bottom: 10px;
  }
</style>
</head>
<body>

<div class="wall-header">
  <h1 class="wall-title">Snap<em>Wall</em> — live</h1>
  <div class="wall-meta">
    <span class="live-dot"></span>
    <span id="countText" class="frame-counter">0 foto</span>
  </div>
</div>

<div id="grid" class="grid"></div>
<div id="emptyState" class="empty-state" style="display:none;">
  <p class="big">Belum ada foto</p>
  <p>Ambil foto pertama lewat halaman kamera, dan dia bakal muncul di sini.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  const grid = document.getElementById('grid');
  const emptyState = document.getElementById('emptyState');
  const countText = document.getElementById('countText');

  function makeTile(photo){
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.dataset.id = photo.id;
    tile.innerHTML = `
      <img src="${photo.photo_url}" alt="foto dari ${photo.username}" loading="lazy">
      <div class="cap">${escapeHtml(photo.username)}</div>
    `;
    return tile;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function updateCount(){
    const n = grid.children.length;
    countText.textContent = `${n} foto`;
    emptyState.style.display = n === 0 ? 'block' : 'none';
  }

  async function loadInitial(){
    try{
      const photos = await fetchVisiblePhotos();
      grid.innerHTML = '';
      photos.forEach(p => grid.appendChild(makeTile(p)));
      updateCount();
    }catch(err){
      console.error(err);
      countText.textContent = 'Gagal muat foto';
    }
  }

  subscribeToNewPhotos((photo) => {
    const tile = makeTile(photo);
    grid.prepend(tile);
    updateCount();
  });

  loadInitial();
</script>

</body>
</html>
