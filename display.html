<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hapki Snap — Live Wall</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body{ height: 100%; overflow: hidden; }

  .wall-shell{
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  .wall-header{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: clamp(14px, 2.2vh, 28px) clamp(16px, 3vw, 44px) 0;
    flex: 0 0 auto;
  }
  .wall-title-block{ display: flex; flex-direction: column; }
  .wall-title{
    font-family: var(--font-display);
    font-weight: 400;
    letter-spacing: 0.01em;
    font-size: clamp(22px, 3.6vh, 36px);
    margin: 0;
    line-height: 1;
  }
  .wall-title span{ color: var(--flash); }
  .belt-stripe{ margin-top: 8px; }
  .wall-meta{
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--graphite);
    font-size: clamp(12px, 1.5vh, 15px);
  }
  .live-dot{
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--flash);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%, 100%{ opacity: 1; } 50%{ opacity: 0.3; } }

  /* ---------------- Ticker rows ---------------- */
  .rows{
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: clamp(8px, 1.6vh, 20px);
    padding: clamp(10px, 1.6vh, 22px) 0;
  }
  .row-viewport{
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: hidden;
    mask-image: linear-gradient(to right,
      transparent 0%,
      rgba(0,0,0,0.45) 5%,
      black 14%,
      black 86%,
      rgba(0,0,0,0.45) 95%,
      transparent 100%);
    -webkit-mask-image: linear-gradient(to right,
      transparent 0%,
      rgba(0,0,0,0.45) 5%,
      black 14%,
      black 86%,
      rgba(0,0,0,0.45) 95%,
      transparent 100%);
  }
  .row-track{
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    display: flex;
    align-items: center;
    gap: clamp(10px, 1.6vw, 26px);
    will-change: transform;
  }

  .tile{
    position: relative;
    height: 78%;
    aspect-ratio: 4 / 3;
    flex: 0 0 auto;
    background: var(--paper);
    padding: clamp(4px, 0.6vw, 9px) clamp(4px, 0.6vw, 9px) clamp(16px, 2.6vh, 28px);
    transform: var(--jitter, none);
  }
  .tile img{ width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .cap{
    position: absolute;
    bottom: clamp(3px, 0.5vh, 7px);
    left: 9px;
    right: 9px;
    font-family: var(--font-display);
    letter-spacing: 0.02em;
    font-size: clamp(11px, 1.7vh, 18px);
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tile.fresh{ animation: freshpop 0.75s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes freshpop{
    0%{
      opacity: 0;
      filter: brightness(1.9) blur(9px);
      transform: var(--jitter, none) scale(0.68) rotate(-9deg);
      box-shadow: 0 0 46px 12px rgba(255,255,255,0.55);
    }
    45%{
      opacity: 1;
      filter: brightness(1.15) blur(0px);
      transform: var(--jitter, none) scale(1.06) rotate(2deg);
      box-shadow: 0 0 20px 5px rgba(255,255,255,0.28);
    }
    100%{
      opacity: 1;
      filter: brightness(1) blur(0px);
      transform: var(--jitter, none) scale(1) rotate(0deg);
      box-shadow: 0 0 0 0 rgba(255,255,255,0);
    }
  }

  /* Fewer rows on narrow or short screens: remaining rows use the
     freed-up space automatically since they're flex:1. */
  @media (max-width: 700px){
    .row-viewport:nth-child(3){ display: none; }
  }
  @media (max-height: 480px) and (orientation: landscape){
    .row-viewport:nth-child(3){ display: none; }
  }

  .empty-state{
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--graphite);
    padding: 24px;
  }
  .empty-state .big{
    font-family: var(--font-display);
    letter-spacing: 0.01em;
    font-size: clamp(24px, 4.5vh, 38px);
    color: var(--paper);
    margin-bottom: 8px;
  }
</style>
</head>
<body>

<div class="wall-shell">
  <div class="wall-header">
    <div class="wall-title-block">
      <h1 class="wall-title">HAPKI<span>SNAP</span> — LIVE</h1>
      <div class="belt-stripe"><span></span><span></span></div>
    </div>
    <div class="wall-meta">
      <span class="live-dot"></span>
      <span id="countText" class="frame-counter">0 photos</span>
    </div>
  </div>

  <div id="rows" class="rows">
    <div class="row-viewport"><div class="row-track" id="track0"></div></div>
    <div class="row-viewport"><div class="row-track" id="track1"></div></div>
    <div class="row-viewport"><div class="row-track" id="track2"></div></div>
  </div>

  <div id="emptyState" class="empty-state" style="display:none;">
    <p class="big">No photos yet</p>
    <p>Take the first photo from the camera page and it'll show up here.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  // ============================================================
  // Ticker-style carousel: photos flow in from the right edge and
  // exit at the left, continuously, like a news ticker. New photos
  // are appended live to the end of a row's queue, so they arrive
  // in order from the right rather than the wall jumping/resetting.
  // ============================================================

  const NUM_ROWS = 3;
  const SPEED_PX_PER_SEC = 55;
  const BUFFER_MULTIPLIER = 1.15; // keep this many viewport-widths of content queued ahead

  const countText = document.getElementById('countText');
  const emptyState = document.getElementById('emptyState');
  const rowsEl = document.getElementById('rows');

  const rows = [0, 1, 2].map(i => ({
    viewport: document.querySelectorAll('.row-viewport')[i],
    track: document.getElementById('track' + i),
    queue: [],       // [{ el, photo }] left-to-right DOM order
    sourcePool: [],  // unique photos assigned to this row
    lapQueue: [],    // shuffled, not-yet-shown-this-lap photos
    lastServed: null,
    offset: 0
  }));

  let totalPhotoCount = 0;
  const knownIds = new Set();

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function updateVisibility(){
    const hasPhotos = totalPhotoCount > 0;
    countText.textContent = `${totalPhotoCount} photo${totalPhotoCount === 1 ? '' : 's'}`;
    emptyState.style.display = hasPhotos ? 'none' : 'flex';
    rowsEl.style.display = hasPhotos ? 'flex' : 'none';
  }

  function randomBetween(min, max){
    return Math.random() * (max - min) + min;
  }

  function buildTile(photo, isFresh){
    const div = document.createElement('div');
    div.className = 'tile' + (isFresh ? ' fresh' : '');
    div.innerHTML = `
      <img src="${photo.photo_url}" alt="photo from ${escapeHtml(photo.username)}" loading="lazy">
      <div class="cap">${escapeHtml(photo.username)}</div>
    `;

    // Scatter each tile slightly so the wall doesn't look like a
    // perfectly ruled grid: a little rotation, a vertical nudge and
    // a small size variance, like snapshots pinned up by hand.
    const rot = randomBetween(-4.5, 4.5).toFixed(2);
    const yJitter = randomBetween(-16, 16).toFixed(1);
    const scale = randomBetween(0.88, 1.06).toFixed(3);
    div.style.zIndex = String(Math.round(randomBetween(1, 10)));
    div.style.marginLeft = `${randomBetween(6, 34).toFixed(1)}px`;
    div.style.marginRight = `${randomBetween(6, 34).toFixed(1)}px`;

    return div;
  }

  function appendTile(row, photo, isFresh){
    const el = buildTile(photo, isFresh);
    row.track.appendChild(el);
    row.queue.push({ el, photo });
  }

  function isRowVisible(row){
    return row.viewport.offsetParent !== null;
  }

  function shuffle(arr){
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Pulls the next photo to display in this row. Each photo is shown
  // once per shuffled "lap" through the row's pool, and we just make
  // sure the same photo never lands immediately back-to-back across
  // a lap boundary. We deliberately do NOT block on a photo already
  // being visible elsewhere in the row — that produced real empty
  // gaps in the belt when a row's pool was small, which read as
  // tiles just vanishing instead of being replaced. Keeping the belt
  // continuously fed is what sells the "exits left, re-enters right"
  // illusion; keeping duplicates from looking cluttered is handled
  // instead by spacing tiles further apart (see buildTile's random
  // margins) and a modest BUFFER_MULTIPLIER.
  function nextFromPool(row){
    if (row.lapQueue.length === 0){
      if (row.sourcePool.length === 0) return null;
      const next = shuffle(row.sourcePool);
      if (row.lastServed && next.length > 1 && next[0].id === row.lastServed.id){
        [next[0], next[1]] = [next[1], next[0]];
      }
      row.lapQueue = next;
    }
    const photo = row.lapQueue.shift();
    row.lastServed = photo;
    return photo;
  }

  function ensureBuffer(row){
    if (row.sourcePool.length === 0) return;
    const viewportWidth = row.viewport.clientWidth || 0;
    if (viewportWidth === 0) return;

    // In practice this should rarely fire now, since we refill
    // continuously below — but it's a safety net for edge cases.
    resetOffsetIfEmpty(row);

    // Keep the belt topped up to a modest buffer of width queued
    // ahead on screen, refilling immediately whenever there's room —
    // no artificial delay. That's what makes a tile exiting on the
    // left feel like it's replaced right away by one entering on the
    // right, instead of the row going quiet for a moment.
    let guard = 0;
    while (guard++ < 40){
      const viewportRect = row.viewport.getBoundingClientRect();
      const trackRect = row.track.getBoundingClientRect();
      const aheadWidth = trackRect.right - viewportRect.right;
      if (aheadWidth > viewportWidth * BUFFER_MULTIPLIER) break;
      const nextPhoto = nextFromPool(row);
      if (!nextPhoto) break;
      appendTile(row, nextPhoto, false);
    }
  }

  function recycle(row){
    if (row.queue.length === 0) return;
    const viewportRect = row.viewport.getBoundingClientRect();
    let guard = 0;
    while (row.queue.length && guard++ < 40){
      const firstEl = row.queue[0].el;
      const rect = firstEl.getBoundingClientRect();
      if (rect.right < viewportRect.left){
        row.track.removeChild(firstEl);
        row.queue.shift();
      } else break;
    }
  }

  // Whenever we're about to append into a row that currently has no
  // tiles at all, make sure the track's offset is put back at "just
  // past the right edge" first. Without this, a row that starts
  // completely empty (e.g. before any photos have loaded) still has
  // its offset sitting at 0, so the very first tiles appended land
  // right inside the visible area instead of gliding in from the
  // right — which is exactly what made the initial batch (and any
  // photo arriving after a row went empty) look like it "just
  // popped in" all together instead of entering naturally.
  function resetOffsetIfEmpty(row){
    if (row.queue.length === 0){
      const vw = row.viewport.clientWidth || 0;
      row.offset = vw;
      row.track.style.transform = `translateX(${row.offset}px)`;
    }
  }

  function addPhotoToRow(row, photo, isFresh){
    row.sourcePool.push(photo);
    resetOffsetIfEmpty(row);
    appendTile(row, photo, isFresh);
  }

  function addNewPhoto(photo){
    if (knownIds.has(photo.id)) return;
    knownIds.add(photo.id);
    totalPhotoCount++;
    updateVisibility();

    const rowIndex = (totalPhotoCount - 1) % NUM_ROWS;
    addPhotoToRow(rows[rowIndex], photo, true);
  }

  async function loadInitial(){
    try{
      const initial = await fetchVisiblePhotos(); // newest first
      const oldestFirst = initial.slice().reverse();
      oldestFirst.forEach(photo => {
        knownIds.add(photo.id);
        totalPhotoCount++;
        const rowIndex = (totalPhotoCount - 1) % NUM_ROWS;
        addPhotoToRow(rows[rowIndex], photo, false);
      });
      updateVisibility();
    }catch(err){
      console.error(err);
      countText.textContent = 'Failed to load photos';
    }
  }

  // Realtime: instant updates when Supabase Realtime is enabled on the table.
  subscribeToNewPhotos((photo) => addNewPhoto(photo));

  // Polling fallback: catches anything realtime misses.
  const POLL_INTERVAL = 8000;
  setInterval(async () => {
    try{
      const latest = await fetchVisiblePhotos();
      const fresh = latest.filter(p => !knownIds.has(p.id));
      fresh.reverse().forEach(p => addNewPhoto(p));
    }catch(err){
      console.error('poll refresh failed', err);
    }
  }, POLL_INTERVAL);

  // ---------------- main animation loop ----------------
  let lastTs = null;
  function tick(ts){
    if (lastTs === null) lastTs = ts;
    const dt = Math.min((ts - lastTs) / 1000, 0.1); // clamp to avoid big jumps on tab refocus
    lastTs = ts;

    rows.forEach(row => {
      if (!isRowVisible(row)) return;
      if (row.queue.length > 0){
        row.offset -= SPEED_PX_PER_SEC * dt;
        row.track.style.transform = `translateX(${row.offset}px)`;
        recycle(row);
      }
      ensureBuffer(row);
    });

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  loadInitial();
</script>

</body>
</html>
