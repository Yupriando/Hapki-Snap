<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hapki Snap — Live Wall</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body{ height: 100%; overflow: hidden; }

  body{
    background-image:
      radial-gradient(ellipse at 15% -10%, rgba(217,30,54,0.10), transparent 55%),
      radial-gradient(ellipse at 90% 110%, rgba(37,87,199,0.10), transparent 50%);
    background-repeat: no-repeat;
  }

  /* Mascot faces scattered across the backdrop (images in mascots/).
     Kept faint so the photos stay the focus. Built by JS below. */
  .mascot-layer{
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .mascot{
    position: absolute;
    opacity: var(--alpha, 0.14);
    transform: translate(-50%, -50%) rotate(var(--rot, 0deg));
    animation: mascotfloat var(--dur, 9s) ease-in-out var(--delay, 0s) infinite alternate;
  }
  @keyframes mascotfloat{
    from{ transform: translate(-50%, -50%) rotate(var(--rot, 0deg)); }
    to{ transform: translate(-50%, calc(-50% - 10px)) rotate(calc(var(--rot, 0deg) * -1)); }
  }
  @media (prefers-reduced-motion: reduce){
    .mascot{ animation: none; }
  }

  .login-wrap{
    position: relative;
    z-index: 1;
    height: 100vh;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card{
    width: 100%;
    max-width: 380px;
    padding: 40px 32px;
    background: var(--ink-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }
  .login-card h1{
    font-family: var(--font-display);
    font-weight: 400;
    letter-spacing: 0.01em;
    font-size: 32px;
    margin: 0 0 8px;
  }
  .login-card h1 span{ color: var(--flash); }
  .login-card p{ color: var(--graphite); font-size: 14px; margin: 0 0 24px; }
  .login-card .field{ margin-bottom: 12px; }
  .login-error{ font-size: 13px; color: var(--flash); min-height: 16px; margin: 8px 0 0; }

  /* "Scan to join" card, pinned bottom-right over the wall so guests
     can open the photo booth from the big screen. */
  .join-qr{
    position: fixed;
    right: clamp(12px, 2vw, 32px);
    bottom: clamp(12px, 2vh, 28px);
    z-index: 3;
    background: var(--paper);
    color: var(--ink);
    padding: clamp(8px, 1.2vh, 14px);
    border-radius: var(--radius);
    box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    text-align: center;
  }
  .join-qr img{
    display: block;
    width: clamp(96px, 17vh, 190px);
    height: auto;
  }
  .join-qr .join-title{
    font-family: var(--font-display);
    letter-spacing: 0.03em;
    font-size: clamp(15px, 2.4vh, 26px);
    line-height: 1;
    margin-top: 6px;
  }
  .join-qr .join-title span{ color: var(--flash); }
  .join-qr .join-url{
    font-size: clamp(9px, 1.15vh, 13px);
    color: var(--graphite-dim);
    margin-top: 3px;
  }

  .wall-shell{
    position: relative;
    z-index: 1;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  .wall-header{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: clamp(14px, 2.2vh, 28px) clamp(16px, 3vw, 44px) 0;
    flex: 0 0 auto;
  }
  .wall-title-block{ display: flex; flex-direction: column; }
  .wall-title{
    font-family: var(--font-display);
    font-weight: 400;
    letter-spacing: 0.01em;
    font-size: clamp(22px, 3.6vh, 36px);
    margin: 0;
    line-height: 1;
  }
  .wall-title span{ color: var(--flash); }
  .belt-stripe{ margin-top: 8px; }
  .wall-meta{
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--graphite);
    font-size: clamp(12px, 1.5vh, 15px);
  }
  .live-dot{
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--flash);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%, 100%{ opacity: 1; } 50%{ opacity: 0.3; } }

  /* ---------------- Ticker rows ---------------- */
  .rows{
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: clamp(10px, 2vh, 26px);
    padding: clamp(10px, 1.6vh, 22px) 0;
  }
  .row-viewport{
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: hidden;
    mask-image: linear-gradient(to right,
      transparent 0%, rgba(0,0,0,0.4) 4%, black 12%,
      black 88%, rgba(0,0,0,0.4) 96%, transparent 100%);
    -webkit-mask-image: linear-gradient(to right,
      transparent 0%, rgba(0,0,0,0.4) 4%, black 12%,
      black 88%, rgba(0,0,0,0.4) 96%, transparent 100%);
  }
  .row-track{ position: absolute; inset: 0; }

  /* Outer element: JS moves this every frame (position only).
     It never gets a CSS animation, so there's nothing for the
     per-frame transform to fight with. */
  .tile{
    position: absolute;
    top: 50%;
    left: 0;
    will-change: transform;
  }

  /* Inner element: static per-tile rotation/scale set once at
     creation time via the --rot custom property, plus the
     one-time entrance animation. JS never touches this element. */
  /* Polaroid layout: equal border on top and sides, a thicker strip
     at the bottom that holds the name. All sizes come from JS (in px)
     so the photo box exactly matches the photo's aspect ratio and the
     caption always sits in its own strip, never over the photo. */
  .tile-card{
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--paper);
    padding: var(--pad) var(--pad) 0;
    border-radius: calc(var(--radius) * 0.5);
    box-shadow: 0 10px 24px rgba(0,0,0,0.35);
    transform: rotate(var(--rot, 0deg));
  }
  .tile-card img{
    width: 100%;
    height: var(--photo-h);
    flex: 0 0 auto;
    object-fit: contain;   /* never crop the photo */
    display: block;
    background: #e9e6df;
  }
  .tile-card .cap{
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    min-width: 0;
    padding: 0 2px;
    font-family: var(--font-display);
    letter-spacing: 0.02em;
    font-size: var(--cap-font);
    font-weight: 400;
    line-height: 1;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tile-card.fresh{ animation: freshpop 0.6s cubic-bezier(0.2, 0.9, 0.25, 1); }
  @keyframes freshpop{
    0%{
      opacity: 0;
      filter: brightness(1.8) blur(6px);
      transform: rotate(var(--rot, 0deg)) scale(0.72);
      box-shadow: 0 0 34px 8px rgba(255,255,255,0.5);
    }
    100%{
      opacity: 1;
      filter: brightness(1) blur(0px);
      transform: rotate(var(--rot, 0deg)) scale(1);
      box-shadow: 0 10px 24px rgba(0,0,0,0.35);
    }
  }

  @media (max-width: 700px){
    .row-viewport:nth-child(3){ display: none; }
  }
  @media (max-height: 480px) and (orientation: landscape){
    .row-viewport:nth-child(3){ display: none; }
  }

  .empty-state{
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--graphite);
    padding: 24px;
  }
  .empty-state .big{
    font-family: var(--font-display);
    letter-spacing: 0.01em;
    font-size: clamp(24px, 4.5vh, 38px);
    color: var(--paper);
    margin-bottom: 8px;
  }
</style>
</head>
<body>

<div id="mascotLayer" class="mascot-layer" aria-hidden="true"></div>

<div class="login-wrap" id="loginWrap" style="display:none;">
  <div class="login-card viewfinder">
    <span class="vf-tl"></span><span class="vf-tr"></span>
    <span class="vf-bl"></span><span class="vf-br"></span>
    <h1>HAPKI<span>SNAP</span> — LIVE</h1>
    <p>Sign in to open the live wall.</p>
    <input class="field" id="loginEmail" type="email" placeholder="Email" autocomplete="username">
    <input class="field" id="loginPass" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn btn-primary" id="loginBtn" style="width:100%; margin-top:8px;">Open wall</button>
    <p class="login-error" id="loginError"></p>
  </div>
</div>

<div class="wall-shell" id="wallShell" style="display:none;">
  <div class="wall-header">
    <div class="wall-title-block">
      <h1 class="wall-title">HAPKI<span>SNAP</span> — LIVE</h1>
      <div class="belt-stripe"><span></span><span></span></div>
    </div>
    <div class="wall-meta">
      <span class="live-dot"></span>
      <span id="countText" class="frame-counter">0 photos</span>
    </div>
  </div>

  <div id="rows" class="rows">
    <div class="row-viewport"><div class="row-track" id="track0"></div></div>
    <div class="row-viewport"><div class="row-track" id="track1"></div></div>
    <div class="row-viewport"><div class="row-track" id="track2"></div></div>
  </div>

  <div class="join-qr">
    <img src="qr-code.svg" alt="QR code to hapki-snap.vercel.app">
    <div class="join-title">SCAN TO <span>SNAP</span></div>
    <div class="join-url">hapki-snap.vercel.app</div>
  </div>

  <div id="emptyState" class="empty-state" style="display:none;">
    <p class="big">No photos yet</p>
    <p>Take the first photo from the camera page and it'll show up here.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  // ============================================================
  // Straight ticker carousel, right-to-left, 3 rows — designed to
  // comfortably show a large, ever-growing number of guest photos
  // over the course of an event.
  //
  // Every tile's position is plain JS arithmetic (a running
  // cumulative-x per row), never read back from the DOM inside the
  // animation loop. That's the fix for the earlier glitch: reading
  // getBoundingClientRect() every frame in a tight loop raced with
  // layout timing and could show two tiles overlapping for a frame.
  // Here there is nothing to race — position is just addition.
  //
  // Rotation/scale ("pinned photo" look) lives on a separate inner
  // element that JS never touches, so it can't conflict with the
  // per-frame position transform on the outer element.
  //
  // Each row keeps its own shuffled "lap" through its assigned
  // photos so the same photo doesn't repeat back-to-back, which
  // matters once a row is cycling through only a handful of photos
  // early in an event.
  // ============================================================

  const NUM_ROWS = 3;
  const BASE_SPEED = 52;                    // px/second
  const ROW_SPEED_MULT = [1, 0.86, 1.14];   // subtle per-row variety, same direction
  const BUFFER_MULTIPLIER = 1.3;

  const WIDTH_JITTER = [0.9, 1.08];   // tile height multiplier range (kept tighter, and capped so it can never exceed the row)
  const GAP_JITTER = [0.7, 1.5];      // gap multiplier range
  const ROTATION_RANGE = 3.2;         // degrees, +/-
  const MAX_ROW_FILL = 0.9;           // a tile's (rotated) height never exceeds this fraction of the row's height
  const POLAROID_PAD = 0.045;         // top/side border, fraction of card height
  const POLAROID_CAP = 0.15;          // bottom name strip, fraction of card height
  const DEFAULT_ASPECT = 3 / 4;       // width/height used if a photo's real size can't be read
  const ASPECT_RANGE = [0.5, 2];      // clamp extreme panoramas/strips so tiles stay sensible

  const countText = document.getElementById('countText');
  const emptyState = document.getElementById('emptyState');
  const rowsEl = document.getElementById('rows');

  const rows = [0, 1, 2].map(i => ({
    viewport: document.querySelectorAll('.row-viewport')[i],
    track: document.getElementById('track' + i),
    speedMult: ROW_SPEED_MULT[i],
    queue: [],        // [{ el, x, width, vOffset }] in append order
    sourcePool: [],   // unique photos assigned to this row
    lapQueue: [],     // shuffled, not-yet-shown-this-lap photos
    lastServed: null,
    offset: 0,
    baseGap: 0,
    rowHeight: 0,
    viewportWidth: 0
  }));

  let totalPhotoCount = 0;
  const knownIds = new Set();

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function rand(min, max){ return min + Math.random() * (max - min); }

  function shuffle(arr){
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function updateVisibility(){
    const hasPhotos = totalPhotoCount > 0;
    countText.textContent = `${totalPhotoCount} photo${totalPhotoCount === 1 ? '' : 's'}`;
    emptyState.style.display = hasPhotos ? 'none' : 'flex';
    rowsEl.style.display = hasPhotos ? 'flex' : 'none';
  }

  function isRowVisible(row){
    return row.viewport.offsetParent !== null;
  }

  function measureRow(row){
    const rect = row.viewport.getBoundingClientRect();
    row.rowHeight = rect.height;
    row.viewportWidth = rect.width;
    row.baseGap = row.rowHeight * 0.24;
  }

  function measureAllRows(){ rows.forEach(measureRow); }

  // Pulls the next photo for a row: shuffles a fresh lap through the
  // row's pool whenever the previous lap runs out, and swaps the
  // first pick if it would repeat the very last photo shown.
  function nextFromPool(row){
    if (row.lapQueue.length === 0){
      if (row.sourcePool.length === 0) return null;
      const next = shuffle(row.sourcePool);
      if (row.lastServed && next.length > 1 && next[0].id === row.lastServed.id){
        [next[0], next[1]] = [next[1], next[0]];
      }
      row.lapQueue = next;
    }
    const photo = row.lapQueue.shift();
    row.lastServed = photo;
    return photo;
  }

  function appendTileToRow(row, photo, isFresh){
    // Height is randomized but capped so a tile can never be taller
    // than the row itself (overflow:hidden on the row would clip it).
    // Width is derived from height so the photo box inside the card
    // matches the photo's own aspect ratio — portrait photos get
    // portrait tiles, landscape get landscape.
    //
    // Polaroid proportions, as fractions of the card height:
    // PAD border on top/sides, CAP strip at the bottom for the name.
    const aspect = photo.aspect || DEFAULT_ASPECT;
    const rot = rand(-ROTATION_RANGE, ROTATION_RANGE);
    const photoFrac = 1 - POLAROID_PAD - POLAROID_CAP;
    const widthRatio = photoFrac * aspect + 2 * POLAROID_PAD; // card width / card height
    // A rotated card's bounding box is taller than the card itself
    // (more so for wide landscape cards), so shrink it until that
    // box fits inside the row — nothing gets clipped top or bottom.
    const rad = Math.abs(rot) * Math.PI / 180;
    const rotGrow = widthRatio * Math.sin(rad) + Math.cos(rad);
    const height = Math.min(
      row.rowHeight * MAX_ROW_FILL * rand(WIDTH_JITTER[0], WIDTH_JITTER[1]),
      row.rowHeight * MAX_ROW_FILL / rotGrow
    );
    const width = height * widthRatio;
    const boxHeight = height * rotGrow;
    const gapBefore = row.queue.length === 0 ? 0 : row.baseGap * rand(GAP_JITTER[0], GAP_JITTER[1]);
    const prev = row.queue[row.queue.length - 1];
    // A row with nothing in it yet starts its first tile off past
    // the right edge, so it glides in instead of popping into view.
    const x = prev ? prev.x + prev.width + gapBefore : (row.viewportWidth || 0);
    // Vertical wiggle is limited to whatever slack is left after the
    // tile's own height, so it can never push the tile (or its
    // caption) outside the row's visible bounds.
    const slack = Math.max(0, (row.rowHeight - boxHeight) / 2) * 0.85;
    const vOffset = rand(-slack, slack);

    const outer = document.createElement('div');
    outer.className = 'tile';
    outer.style.width = width + 'px';
    outer.style.height = height + 'px';

    const pad = height * POLAROID_PAD;
    const capH = height * POLAROID_CAP;
    const card = document.createElement('div');
    card.className = 'tile-card' + (isFresh ? ' fresh' : '');
    card.style.setProperty('--rot', rot.toFixed(2) + 'deg');
    card.style.setProperty('--pad', pad.toFixed(1) + 'px');
    card.style.setProperty('--photo-h', (height * photoFrac).toFixed(1) + 'px');
    card.style.setProperty('--cap-font', Math.max(11, capH * 0.45).toFixed(1) + 'px');
    card.innerHTML = `
      <img src="${photo.photo_url}" alt="photo from ${escapeHtml(photo.username)}" loading="lazy">
      <div class="cap">${escapeHtml(photo.username)}</div>
    `;
    outer.appendChild(card);
    row.track.appendChild(outer);

    row.queue.push({ el: outer, x, width, vOffset });
  }

  function ensureBuffer(row){
    if (row.sourcePool.length === 0 || row.rowHeight === 0) return;
    let guard = 0;
    while (guard++ < 40){
      const last = row.queue[row.queue.length - 1];
      const rightEdge = last ? last.x + last.width + row.offset : row.offset;
      if (rightEdge > row.viewportWidth * BUFFER_MULTIPLIER) break;
      const nextPhoto = nextFromPool(row);
      if (!nextPhoto) break;
      appendTileToRow(row, nextPhoto, false);
    }
  }

  function recycleRow(row){
    let guard = 0;
    while (row.queue.length && guard++ < 40){
      const first = row.queue[0];
      const rightEdgeOnScreen = first.x + first.width + row.offset;
      if (rightEdgeOnScreen < 0){
        row.track.removeChild(first.el);
        row.queue.shift();
      } else break;
    }
  }

  // Loads the image once to read its real width/height, so the tile
  // can be shaped to match. Also warms the browser cache, so the tile
  // shows the photo immediately once it's on screen.
  function loadAspect(photo){
    if (photo.aspect) return Promise.resolve(photo.aspect);
    return new Promise(resolve => {
      const img = new Image();
      const done = (aspect) => {
        photo.aspect = Math.min(ASPECT_RANGE[1], Math.max(ASPECT_RANGE[0], aspect));
        resolve(photo.aspect);
      };
      img.onload = () => done(img.naturalWidth && img.naturalHeight
        ? img.naturalWidth / img.naturalHeight
        : DEFAULT_ASPECT);
      img.onerror = () => done(DEFAULT_ASPECT);
      img.src = photo.photo_url;
    });
  }

  function addPhotoToRow(row, photo, isFresh){
    row.sourcePool.push(photo);
    appendTileToRow(row, photo, isFresh);
  }

  async function addNewPhoto(photo){
    if (knownIds.has(photo.id)) return;
    knownIds.add(photo.id);
    await loadAspect(photo);
    totalPhotoCount++;
    updateVisibility();
    const rowIndex = (totalPhotoCount - 1) % NUM_ROWS;
    addPhotoToRow(rows[rowIndex], photo, true);
  }

  async function loadInitial(){
    try{
      const initial = await fetchVisiblePhotos(); // newest first
      const oldestFirst = initial.slice().reverse();
      await Promise.all(oldestFirst.map(loadAspect));
      oldestFirst.forEach(photo => {
        // A realtime/poll update may have added it while images loaded.
        if (knownIds.has(photo.id)) return;
        knownIds.add(photo.id);
        totalPhotoCount++;
        const rowIndex = (totalPhotoCount - 1) % NUM_ROWS;
        addPhotoToRow(rows[rowIndex], photo, false);
      });
      updateVisibility();
    }catch(err){
      console.error(err);
      countText.textContent = 'Failed to load photos';
    }
  }

  // ---------------- login gate ----------------
  // The wall only loads after signing in (same Supabase Auth account
  // as admin.html, or a separate one made for the display). The
  // database also refuses to hand out the photo list without a login
  // (schema-display-lock.sql), so this isn't just a cosmetic lock.
  // Supabase keeps the session in this browser, so the display
  // laptop only needs to sign in once.
  const POLL_INTERVAL = 8000;
  const loginWrap = document.getElementById('loginWrap');
  const wallShell = document.getElementById('wallShell');
  const loginEmail = document.getElementById('loginEmail');
  const loginPass = document.getElementById('loginPass');
  const loginBtn = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');
  let wallStarted = false;

  function startWall(){
    if (wallStarted) return;
    wallStarted = true;
    loginWrap.style.display = 'none';
    wallShell.style.display = 'flex';
    measureAllRows();

    subscribeToNewPhotos((photo) => addNewPhoto(photo));
    setInterval(async () => {
      try{
        const latest = await fetchVisiblePhotos();
        const fresh = latest.filter(p => !knownIds.has(p.id));
        fresh.reverse().forEach(p => addNewPhoto(p));
      }catch(err){
        console.error('poll refresh failed', err);
      }
    }, POLL_INTERVAL);
    loadInitial();
  }

  loginBtn.addEventListener('click', async () => {
    loginError.textContent = '';
    loginBtn.disabled = true;
    const { error } = await supabaseClient.auth.signInWithPassword({
      email: loginEmail.value.trim(),
      password: loginPass.value
    });
    loginBtn.disabled = false;
    if (error){
      loginError.textContent = 'Incorrect email or password.';
      return;
    }
    startWall();
  });
  loginPass.addEventListener('keydown', (e) => { if (e.key === 'Enter') loginBtn.click(); });

  // ---------------- mascot backdrop ----------------
  // Scatters the mascot faces over a jittered grid so they spread
  // evenly across the screen without clumping, each with its own
  // size, tilt and float timing. Neighbouring cells never repeat
  // the same face.
  const MASCOT_COUNT = 8;              // mascots/mascot-1.png ... mascot-8.png
  const mascotLayer = document.getElementById('mascotLayer');

  function buildMascots(){
    mascotLayer.innerHTML = '';
    const w = window.innerWidth, h = window.innerHeight;
    const cell = Math.max(120, Math.min(w, h) / 3.2);
    const cols = Math.ceil(w / cell) + 1;
    const rowsN = Math.ceil(h / cell) + 1;
    let prev = -1;
    for (let r = 0; r < rowsN; r++){
      for (let c = 0; c < cols; c++){
        let face;
        do { face = Math.floor(Math.random() * MASCOT_COUNT); } while (face === prev);
        prev = face;
        const img = document.createElement('img');
        img.className = 'mascot';
        img.src = `mascots/mascot-${face + 1}.png`;
        img.alt = '';
        const size = cell * rand(0.42, 0.62);
        img.style.width = size + 'px';
        // offset every other row by half a cell, then jitter
        const x = (c + (r % 2 ? 0.5 : 0)) * cell + rand(-0.18, 0.18) * cell;
        const y = (r + 0.5) * cell + rand(-0.18, 0.18) * cell - cell * 0.25;
        img.style.left = x + 'px';
        img.style.top = y + 'px';
        img.style.setProperty('--rot', rand(-16, 16).toFixed(1) + 'deg');
        img.style.setProperty('--alpha', rand(0.1, 0.18).toFixed(2));
        img.style.setProperty('--dur', rand(6, 11).toFixed(1) + 's');
        img.style.setProperty('--delay', (-rand(0, 10)).toFixed(1) + 's');
        mascotLayer.appendChild(img);
      }
    }
  }
  buildMascots();

  measureAllRows();
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { measureAllRows(); buildMascots(); }, 250);
  });

  // ---------------- main animation loop ----------------
  let lastTs = null;
  function tick(ts){
    if (lastTs === null) lastTs = ts;
    const dt = Math.min((ts - lastTs) / 1000, 0.1);
    lastTs = ts;

    rows.forEach(row => {
      if (!isRowVisible(row) || row.rowHeight === 0) return;

      row.offset -= BASE_SPEED * row.speedMult * dt;

      row.queue.forEach(item => {
        const screenX = item.x + row.offset;
        item.el.style.transform = `translate(${screenX}px, calc(-50% + ${item.vOffset}px))`;
      });

      recycleRow(row);
      ensureBuffer(row);
    });

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  supabaseClient.auth.getSession().then(({ data }) => {
    if (data.session) startWall();
    else loginWrap.style.display = 'flex';
  });
</script>
