<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HappySnap — live wall</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body{ height: 100%; overflow: hidden; }

  .wall-shell{
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .wall-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: clamp(14px, 2.2vh, 26px) clamp(16px, 3vw, 40px) 4px;
    flex: 0 0 auto;
  }
  .wall-title{
    font-family: var(--font-display);
    font-size: clamp(18px, 2.6vh, 28px);
    font-weight: 500;
    margin: 0;
  }
  .wall-title em{ font-style: italic; color: var(--flash); }
  .wall-meta{
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--graphite);
    font-size: clamp(12px, 1.4vh, 14px);
  }
  .live-dot{
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--flash);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%, 100%{ opacity: 1; }
    50%{ opacity: 0.3; }
  }

  /* ---------------- Carousel rows ---------------- */
  .rows{
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(10px, 1.8vh, 22px);
    padding: clamp(6px, 1vh, 16px) 0;
  }
  .row-viewport{
    overflow: hidden;
    white-space: nowrap;
    width: 100%;
    mask-image: linear-gradient(to right, transparent, black 3%, black 97%, transparent);
    -webkit-mask-image: linear-gradient(to right, transparent, black 3%, black 97%, transparent);
  }
  .row-track{
    display: inline-flex;
    gap: clamp(12px, 1.8vw, 28px);
    will-change: transform;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  @keyframes scroll-left{
    from{ transform: translateX(0); }
    to{ transform: translateX(-50%); }
  }
  @keyframes scroll-right{
    from{ transform: translateX(-50%); }
    to{ transform: translateX(0); }
  }

  .tile{
    display: inline-block;
    position: relative;
    flex: 0 0 auto;
    background: var(--paper);
    padding: clamp(5px, 0.6vw, 10px) clamp(5px, 0.6vw, 10px) clamp(20px, 2.6vh, 32px);
    /* row height adapts to viewport height so 3 rows always fit */
    height: calc((100vh - 130px) / 3.4);
    width: calc(((100vh - 130px) / 3.4) * 1.32);
    max-width: 46vw;
  }
  .tile img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .tile .cap{
    position: absolute;
    bottom: clamp(4px, 0.6vh, 8px);
    left: 10px;
    right: 10px;
    font-family: var(--font-display);
    font-size: clamp(11px, 1.4vh, 15px);
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tile.fresh{ animation: freshpop 0.6s cubic-bezier(0.2,0.8,0.2,1); }
  @keyframes freshpop{
    0%{ opacity: 0; transform: scale(0.8) translateY(10px); }
    100%{ opacity: 1; transform: scale(1) translateY(0); }
  }

  /* Fewer / shorter rows on narrow or short screens so tiles don't
     get squeezed into slivers on phones and small tablets. */
  @media (max-width: 700px){
    .row-viewport:nth-child(3){ display: none; }
    .tile{ height: calc((100vh - 110px) / 2.4); }
  }
  @media (max-height: 480px) and (orientation: landscape){
    .row-viewport:nth-child(3){ display: none; }
    .tile{ height: calc((100vh - 90px) / 2.2); }
  }

  .empty-state{
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--graphite);
    padding: 24px;
  }
  .empty-state .big{
    font-family: var(--font-display);
    font-size: clamp(22px, 4vh, 32px);
    color: var(--paper);
    margin-bottom: 10px;
  }
</style>
</head>
<body>

<div class="wall-shell">
  <div class="wall-header">
    <h1 class="wall-title">Happy<em>Snap</em> — live</h1>
    <div class="wall-meta">
      <span class="live-dot"></span>
      <span id="countText" class="frame-counter">0 foto</span>
    </div>
  </div>

  <div id="rows" class="rows">
    <div class="row-viewport"><div class="row-track" id="track0"></div></div>
    <div class="row-viewport"><div class="row-track" id="track1"></div></div>
    <div class="row-viewport"><div class="row-track" id="track2"></div></div>
  </div>

  <div id="emptyState" class="empty-state" style="display:none;">
    <p class="big">Belum ada foto</p>
    <p>Ambil foto pertama lewat halaman kamera, dan dia bakal muncul di sini.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  const MAX_TRACKED = 90;
  const ROW_SPEED = 42; // px per second, kept consistent across all rows

  // Each row scrolls a different direction/speed multiple so the
  // wall feels alive rather than three identical conveyor belts.
  const ROW_CONFIG = [
    { dir: 'scroll-left',  speedMult: 1.0 },
    { dir: 'scroll-right', speedMult: 0.85 },
    { dir: 'scroll-left',  speedMult: 1.15 }
  ];

  let photos = [];          // newest first, overall
  const knownIds = new Set();
  const rowBuckets = [[], [], []]; // photos distributed round-robin across rows

  const countText = document.getElementById('countText');
  const emptyState = document.getElementById('emptyState');
  const rowsEl = document.getElementById('rows');
  const tracks = [
    document.getElementById('track0'),
    document.getElementById('track1'),
    document.getElementById('track2')
  ];

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function updateVisibility(){
    const hasPhotos = photos.length > 0;
    countText.textContent = `${photos.length} foto`;
    emptyState.style.display = hasPhotos ? 'none' : 'flex';
    rowsEl.style.display = hasPhotos ? 'flex' : 'none';
  }

  function buildTile(photo, isFresh){
    const div = document.createElement('div');
    div.className = 'tile' + (isFresh ? ' fresh' : '');
    div.innerHTML = `
      <img src="${photo.photo_url}" alt="foto dari ${escapeHtml(photo.username)}" loading="lazy">
      <div class="cap">${escapeHtml(photo.username)}</div>
    `;
    return div;
  }

  function rebuildRow(rowIndex, freshId){
    const track = tracks[rowIndex];
    const list = rowBuckets[rowIndex];
    track.style.animation = 'none';
    track.innerHTML = '';
    if (list.length === 0) return;

    const doubled = list.concat(list);
    doubled.forEach(photo => track.appendChild(buildTile(photo, photo.id === freshId)));

    const cfg = ROW_CONFIG[rowIndex];
    requestAnimationFrame(() => {
      const fullWidth = track.scrollWidth / 2;
      const speed = ROW_SPEED * cfg.speedMult;
      const duration = Math.max(fullWidth / speed, 6);
      track.style.animation = `${cfg.dir} ${duration}s linear infinite`;
    });
  }

  function redistributeRows(freshId){
    rowBuckets[0] = [];
    rowBuckets[1] = [];
    rowBuckets[2] = [];
    photos.forEach((p, i) => rowBuckets[i % 3].push(p));
    rebuildRow(0, freshId);
    rebuildRow(1, freshId);
    rebuildRow(2, freshId);
  }

  function addNewPhoto(photo){
    if (knownIds.has(photo.id)) return;
    knownIds.add(photo.id);
    photos.unshift(photo);
    if (photos.length > MAX_TRACKED){
      const removed = photos.pop();
      knownIds.delete(removed.id);
    }
    updateVisibility();
    redistributeRows(photo.id);
  }

  async function loadInitial(){
    try{
      const initial = await fetchVisiblePhotos();
      photos = initial.slice(0, MAX_TRACKED);
      photos.forEach(p => knownIds.add(p.id));
      updateVisibility();
      redistributeRows(null);
    }catch(err){
      console.error(err);
      countText.textContent = 'Gagal muat foto';
    }
  }

  // Realtime: instant updates when Supabase Realtime is enabled on the table.
  subscribeToNewPhotos((photo) => addNewPhoto(photo));

  // Polling fallback: catches anything realtime misses.
  const POLL_INTERVAL = 8000;
  setInterval(async () => {
    try{
      const latest = await fetchVisiblePhotos();
      const fresh = latest.filter(p => !knownIds.has(p.id));
      fresh.reverse().forEach(p => addNewPhoto(p));
    }catch(err){
      console.error('poll refresh failed', err);
    }
  }, POLL_INTERVAL);

  // Rows are sized with vh-based math; recompute the scroll timing
  // (not just CSS) if the window is resized/rotated so speed stays right.
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => redistributeRows(null), 300);
  });

  loadInitial();
</script>

</body>
</html>
