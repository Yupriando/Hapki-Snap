<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hapki Snap — Live Wall</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body{ height: 100%; overflow: hidden; }

  .wall-shell{
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  .wall-header{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: clamp(14px, 2.2vh, 28px) clamp(16px, 3vw, 44px) 0;
    flex: 0 0 auto;
    z-index: 5;
    position: relative;
  }
  .wall-title-block{ display: flex; flex-direction: column; }
  .wall-title{
    font-family: var(--font-display);
    font-weight: 400;
    letter-spacing: 0.01em;
    font-size: clamp(22px, 3.6vh, 36px);
    margin: 0;
    line-height: 1;
  }
  .wall-title span{ color: var(--flash); }
  .belt-stripe{ margin-top: 8px; }
  .wall-meta{
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--graphite);
    font-size: clamp(12px, 1.5vh, 15px);
  }
  .live-dot{
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--flash);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%, 100%{ opacity: 1; } 50%{ opacity: 0.3; } }

  /* ---------------- Photo sphere ---------------- */
  .sphere-wrap{
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: hidden;
  }
  .sphere-stage{
    position: absolute;
    inset: 0;
  }
  .sphere-tile{
    position: absolute;
    top: 0;
    left: 0;
    background: var(--paper);
    padding: 5% 5% 20%;
    will-change: transform, opacity;
    pointer-events: none;
    transition: filter 0.35s ease;
  }
  .sphere-tile img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .sphere-tile .cap{
    position: absolute;
    bottom: 8%;
    left: 8%;
    right: 8%;
    font-family: var(--font-display);
    letter-spacing: 0.02em;
    font-size: 11px;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sphere-tile.empty{ opacity: 0.08 !important; }
  .sphere-tile.pop{ filter: brightness(1.9); }

  .empty-state{
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--graphite);
    padding: 24px;
    z-index: 4;
  }
  .empty-state .big{
    font-family: var(--font-display);
    letter-spacing: 0.01em;
    font-size: clamp(24px, 4.5vh, 38px);
    color: var(--paper);
    margin-bottom: 8px;
  }
</style>
</head>
<body>

<div class="wall-shell">
  <div class="wall-header">
    <div class="wall-title-block">
      <h1 class="wall-title">HAPKI<span>SNAP</span> — LIVE</h1>
      <div class="belt-stripe"><span></span><span></span></div>
    </div>
    <div class="wall-meta">
      <span class="live-dot"></span>
      <span id="countText" class="frame-counter">0 photos</span>
    </div>
  </div>

  <div class="sphere-wrap" id="sphereWrap">
    <div class="sphere-stage" id="sphereStage"></div>
    <div id="emptyState" class="empty-state">
      <p class="big">No photos yet</p>
      <p>Take the first photo from the camera page and it'll show up here.</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  // ============================================================
  // Ring carousel: a fixed number of "slots" are spaced evenly
  // around a single circle, viewed at a slight tilt so it reads
  // as an orbiting ring (like a carousel/Ferris wheel of photos)
  // rather than a straight line — but it's still just one ring,
  // not a full sphere. Slot *positions* never change, which is
  // what avoids the old ticker's DOM-churn glitches entirely —
  // only the *photo shown* in a slot changes, round-robin, as new
  // photos arrive. New arrivals get a quick brightness "pop" so
  // they're easy to spot as the ring turns.
  // ============================================================

  const RING_COUNT = 24;
  const ROTATE_SPEED = 0.28;  // radians per second
  const TILT_ANGLE = 0.5;     // fixed radians, gives the ring its elliptical "orbit" look

  const countText = document.getElementById('countText');
  const emptyState = document.getElementById('emptyState');
  const sphereWrap = document.getElementById('sphereWrap');
  const sphereStage = document.getElementById('sphereStage');

  const knownIds = new Set();
  let totalPhotoCount = 0;
  let assignCursor = 0;

  // ---- build the fixed ring slot positions ----
  function ringPoints(n){
    const pts = [];
    for (let i = 0; i < n; i++){
      const theta = (2 * Math.PI * i) / n;
      pts.push({ x: Math.cos(theta), y: 0, z: Math.sin(theta) });
    }
    return pts;
  }

  const basePoints = ringPoints(RING_COUNT);
  const slots = basePoints.map(() => {
    const el = document.createElement('div');
    el.className = 'sphere-tile empty';
    el.innerHTML = '<img alt=""><div class="cap"></div>';
    sphereStage.appendChild(el);
    return { el, img: el.querySelector('img'), cap: el.querySelector('.cap'), photo: null };
  });

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function assignPhotoToSlot(photo, isFresh){
    const slot = slots[assignCursor % slots.length];
    assignCursor++;
    slot.photo = photo;
    slot.img.src = photo.photo_url;
    slot.img.alt = `photo from ${escapeHtml(photo.username)}`;
    slot.cap.textContent = photo.username;
    slot.el.classList.remove('empty');
    if (isFresh){
      slot.el.classList.add('pop');
      setTimeout(() => slot.el.classList.remove('pop'), 450);
    }
  }

  function addNewPhoto(photo){
    if (knownIds.has(photo.id)) return;
    knownIds.add(photo.id);
    totalPhotoCount++;
    countText.textContent = `${totalPhotoCount} photo${totalPhotoCount === 1 ? '' : 's'}`;
    emptyState.style.display = 'none';
    assignPhotoToSlot(photo, true);
  }

  async function loadInitial(){
    try{
      const initial = await fetchVisiblePhotos(); // newest first
      if (initial.length === 0){
        emptyState.style.display = 'flex';
        return;
      }
      emptyState.style.display = 'none';
      const oldestFirst = initial.slice().reverse();
      oldestFirst.forEach(photo => {
        knownIds.add(photo.id);
        totalPhotoCount++;
        assignPhotoToSlot(photo, false);
      });
      countText.textContent = `${totalPhotoCount} photo${totalPhotoCount === 1 ? '' : 's'}`;
    }catch(err){
      console.error(err);
      countText.textContent = 'Failed to load photos';
    }
  }

  subscribeToNewPhotos((photo) => addNewPhoto(photo));

  const POLL_INTERVAL = 8000;
  setInterval(async () => {
    try{
      const latest = await fetchVisiblePhotos();
      const fresh = latest.filter(p => !knownIds.has(p.id));
      fresh.reverse().forEach(p => addNewPhoto(p));
    }catch(err){
      console.error('poll refresh failed', err);
    }
  }, POLL_INTERVAL);

  // ---------------- geometry / render loop ----------------
  let cw = 0, ch = 0, cx = 0, cy = 0, radiusPx = 0, tileSize = 0, focal = 0;

  function measure(){
    const rect = sphereWrap.getBoundingClientRect();
    cw = rect.width;
    ch = rect.height;
    cx = cw / 2;
    cy = ch / 2;
    radiusPx = Math.min(cw, ch) * 0.34;
    tileSize = radiusPx * 0.46;
    focal = radiusPx * 2.4;
  }
  measure();
  window.addEventListener('resize', measure);

  let startTs = null;
  const cosT = Math.cos(TILT_ANGLE), sinT = Math.sin(TILT_ANGLE);

  function tick(ts){
    if (startTs === null) startTs = ts;
    const t = (ts - startTs) / 1000;
    const angle = t * ROTATE_SPEED;
    const cosA = Math.cos(angle), sinA = Math.sin(angle);

    for (let i = 0; i < slots.length; i++){
      const b = basePoints[i];
      // spin the ring around the vertical (Y) axis
      const x1 = b.x * cosA + b.z * sinA;
      const z1 = -b.x * sinA + b.z * cosA;
      // fixed tilt around X so the ring reads as an orbiting ellipse
      // rather than a flat line when viewed head-on
      const y2 = -z1 * sinT;
      const z2 = z1 * cosT;

      const depth = focal - z2 * radiusPx;
      const scale = focal / depth;
      const screenX = cx + x1 * radiusPx * scale;
      const screenY = cy - y2 * radiusPx * scale;
      const dispSize = tileSize * scale;

      const tNorm = (z2 + 1) / 2; // 0 = far back, 1 = near front
      const opacity = 0.25 + tNorm * 0.75;
      const zIndex = Math.round(tNorm * 1000);

      const el = slots[i].el;
      el.style.width = dispSize + 'px';
      el.style.height = (dispSize * 0.78) + 'px';
      el.style.transform = `translate(${screenX}px, ${screenY}px) translate(-50%, -50%)`;
      el.style.opacity = opacity;
      el.style.zIndex = zIndex;
    }

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  loadInitial();
</script>

</body>
</html>
