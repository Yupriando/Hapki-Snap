<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hapki Snap — Check In</title>
<link rel="stylesheet" href="style.css">
<style>
  .landing-wrap{
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .entry-card{
    width: 100%;
    max-width: 420px;
    padding: 48px 36px;
    background: var(--ink-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }
  .kicker{ font-size: 13px; color: var(--graphite); margin: 0 0 6px; }
  h1{
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 52px;
    line-height: 1;
    letter-spacing: 0.01em;
    margin: 0;
    color: var(--paper);
  }
  h1 span{ color: var(--flash); }
  .sub{
    color: var(--graphite);
    font-size: 15px;
    line-height: 1.5;
    margin: 18px 0 32px;
    max-width: 34ch;
  }
  .mode-toggle{ display: flex; gap: 8px; margin-bottom: 20px; }
  .mode-btn{
    flex: 1;
    padding: 10px;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    color: var(--graphite);
    font-size: 13px;
    font-family: var(--font-ui);
  }
  .mode-btn.active{
    border-color: var(--flash);
    color: var(--paper);
    background: rgba(217,30,54,0.10);
  }
  #nameField{ margin-bottom: 8px; }
  .hint{ font-size: 12px; color: var(--graphite-dim); margin: 0 0 24px; min-height: 16px; }
  .next-btn{ width: 100%; padding: 16px; font-size: 16px; }
</style>
</head>
<body>

<div class="landing-wrap">
  <div class="entry-card viewfinder">
    <span class="vf-tl"></span><span class="vf-tr"></span>
    <span class="vf-bl"></span><span class="vf-br"></span>

    <h1>HAPKI<span>SNAP</span></h1>
    <div class="belt-stripe"><span></span><span></span></div>
    <p class="sub">Take a shot and it instantly appears on the big screen for everyone to see. What's your name?</p>

    <div class="mode-toggle">
      <button class="mode-btn active" id="modeNamed" type="button">Use a name</button>
      <button class="mode-btn" id="modeAnon" type="button">Stay anonymous</button>
    </div>

    <input class="field" id="nameField" type="text" placeholder="Your name" maxlength="24" autocomplete="off">
    <p class="hint" id="hintText">This name will appear under your photo on the big screen.</p>

    <button class="btn btn-primary next-btn" id="nextBtn" type="button">Continue to camera</button>
  </div>
</div>

<script>
  const modeNamed = document.getElementById('modeNamed');
  const modeAnon = document.getElementById('modeAnon');
  const nameField = document.getElementById('nameField');
  const hintText = document.getElementById('hintText');
  const nextBtn = document.getElementById('nextBtn');

  let isAnon = false;

  modeNamed.addEventListener('click', () => {
    isAnon = false;
    modeNamed.classList.add('active');
    modeAnon.classList.remove('active');
    nameField.style.display = 'block';
    hintText.style.display = 'block';
    hintText.style.color = 'var(--graphite-dim)';
    hintText.textContent = 'This name will appear under your photo on the big screen.';
    nameField.focus();
  });

  modeAnon.addEventListener('click', () => {
    isAnon = true;
    modeAnon.classList.add('active');
    modeNamed.classList.remove('active');
    nameField.style.display = 'none';
    hintText.style.color = 'var(--graphite-dim)';
    hintText.textContent = 'You\'ll appear as "Anonymous" on the big screen.';
  });

  nextBtn.addEventListener('click', () => {
    let username = 'Anonymous';
    if (!isAnon) {
      const typed = nameField.value.trim();
      if (!typed) {
        nameField.focus();
        hintText.textContent = 'Enter a name, or choose Stay anonymous.';
        hintText.style.color = 'var(--flash)';
        return;
      }
      username = typed;
    }
    sessionStorage.setItem('hapkisnap_username', username);
    window.location.href = 'camera.html';
  });

  nameField.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') nextBtn.click();
  });
</script>

</body>
</html>
